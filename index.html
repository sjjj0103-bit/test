<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오늘 뭐 입지?</title>
  <meta name="description" content="내 옷장 사진과 이번 주 날씨로 코디를 추천해 주는 웹앱">
  <meta name="theme-color" content="#f7f2ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="뭐입지">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>오늘 뭐 입지?</h1>
    <label class="city">
      <span class="sr">지역</span>
      <select id="city"></select>
    </label>
  </header>

  <main>
    <div id="banner"></div>
    <section id="view-today" class="view active" aria-label="오늘"></section>
    <section id="view-week" class="view" aria-label="이번 주"></section>
    <section id="view-tryon" class="view" aria-label="입혀보기"></section>
    <section id="view-closet" class="view" aria-label="내 옷장"></section>
  </main>

  <button id="fab" class="fab" type="button" aria-label="옷 추가">＋</button>

  <nav class="tabs">
    <button type="button" data-view="today" class="active"><span aria-hidden="true">☀️</span>오늘</button>
    <button type="button" data-view="week"><span aria-hidden="true">📅</span>이번 주</button>
    <button type="button" data-view="tryon"><span aria-hidden="true">🧍‍♀️</span>입혀보기</button>
    <button type="button" data-view="closet"><span aria-hidden="true">👚</span>옷장</button>
  </nav>

  <dialog id="editor">
    <form id="editor-form" method="dialog">
      <h2 id="editor-title">옷 추가</h2>

      <label class="photo-pick">
        <input type="file" accept="image/*" id="photo-input">
        <div id="photo-preview"><span>📷<br>사진 찍기 / 앨범에서 고르기</span></div>
      </label>
      <div class="photo-tools" id="photo-tools"></div>

      <fieldset>
        <legend>종류</legend>
        <div class="chips" id="f-cat"></div>
      </fieldset>

      <fieldset>
        <legend>모양</legend>
        <div class="chips" id="f-kind"></div>
      </fieldset>

      <fieldset>
        <legend>색 <small id="color-hint"></small></legend>
        <div class="colors" id="f-color"></div>
      </fieldset>

      <fieldset>
        <legend>무늬·디테일</legend>
        <div class="pattern-row">
          <div class="chips" id="f-pattern"></div>
          <div id="f-preview" class="garment-preview" aria-hidden="true"></div>
        </div>
        <div id="f-color2-wrap" hidden>
          <p class="sub-legend">무늬 색 <small>(줄·체크·점·꽃 색)</small></p>
          <div class="colors" id="f-color2"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>두께</legend>
        <div class="warmth" id="f-warmth"></div>
      </fieldset>

      <fieldset>
        <legend>어디에 입나요? <small>안 고르면 어디든 OK</small></legend>
        <div class="chips" id="f-occ"></div>
      </fieldset>

      <label class="field">
        <span>이름 <small>핀터레스트 검색에 쓰여요</small></span>
        <input id="f-name" maxlength="30" autocomplete="off">
      </label>

      <div class="editor-actions">
        <button type="button" id="btn-delete" class="danger">삭제</button>
        <span class="grow"></span>
        <button type="button" id="btn-cancel">취소</button>
        <button type="submit" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="bulk">
    <form id="bulk-form" method="dialog">
      <h2>글로 옷 목록 등록</h2>
      <p class="muted">가지고 있는 옷을 <b>한 줄에 하나씩</b> "색 + 종류"로 적어 주세요.<br>
        두께(얇은/두꺼운/기모)나 일정(출근/데이트)을 같이 적으면 알아서 반영해요.</p>
      <textarea id="bulk-text" rows="8" placeholder="베이지 니트&#10;하늘색 흰 스트라이프 반팔티&#10;연청 청바지&#10;흰 셔츠 (출근)&#10;검정 슬랙스 (출근)&#10;네이비 가디건&#10;기모 맨투맨&#10;베이지 트렌치코트&#10;흰 운동화"></textarea>
      <p class="preview-title">미리보기</p>
      <ul id="bulk-preview" class="bulk-preview"></ul>
      <div class="editor-actions">
        <span class="grow"></span>
        <button type="button" id="bulk-cancel">취소</button>
        <button type="submit" id="bulk-save" class="primary">등록하기</button>
      </div>
    </form>
  </dialog>

  <dialog id="cutter">
    <div class="cutter">
      <h2>배경 지우기</h2>
      <p id="cut-status" class="cut-status" role="status"></p>
      <div class="cut-stage checker"><canvas id="cut-canvas"></canvas></div>
      <div class="cut-tools">
        <button type="button" data-cut="ai" class="primary">✨ AI로 자동 지우기</button>
        <div class="toggle">
          <button type="button" data-cut="erase" aria-pressed="true">🧽 지우개</button>
          <button type="button" data-cut="restore" aria-pressed="false">🖌️ 되살리기</button>
        </div>
        <label class="cut-size">붓 크기 <input type="range" id="cut-size" min="6" max="80" value="28"></label>
        <button type="button" data-cut="undo">↶ 되돌리기</button>
        <button type="button" data-cut="reset">처음 사진으로</button>
      </div>
      <p class="muted small">손가락으로 문지르면 지워져요. 옷이 같이 지워졌으면 '되살리기'로 칠해 주세요.</p>
      <div class="editor-actions">
        <span class="grow"></span>
        <button type="button" data-cut="cancel">취소</button>
        <button type="button" data-cut="done" class="primary">완료</button>
      </div>
    </div>
  </dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="avatar.js"></script>
  <script src="cutout.js"></script>
  <script src="app.js"></script>
</body>
</html>
