<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>매일 영어 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one notebook column; sticky tab strip; corrections drawn like a teacher's red pen */
:root{
  --paper:#F4F6F9; --card:#FFFFFF; --ink:#1C2540; --muted:#5D6680; --line:#DCE1EA;
  --accent:#2F4BB8; --accent-ink:#FFFFFF; --pen:#C4372A; --ok:#1E8655; --hl:#F5D547;
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141D; --card:#191E2B; --ink:#E6E9F2; --muted:#9AA3BA; --line:#2C3347;
  --accent:#8FA5FF; --accent-ink:#0F1426; --pen:#FF7D6E; --ok:#55C893; --hl:#D9B93A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141D; --card:#191E2B; --ink:#E6E9F2; --muted:#9AA3BA; --line:#2C3347;
  --accent:#8FA5FF; --accent-ink:#0F1426; --pen:#FF7D6E; --ok:#55C893; --hl:#D9B93A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:20px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-bottom:4px}
h2{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.status{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;overflow-x:auto;
  padding:12px 0 10px;margin-top:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:8px 12px;border-radius:99px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:grid;gap:16px;padding-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.quiet{padding:4px 0;display:grid;gap:10px}
.card p,.quiet p,.card ol{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

button.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
button.link{border:0;background:none;color:var(--accent);font:600 14px var(--f-body);padding:0;cursor:pointer}
textarea,input[type=text],select{width:100%;font:15px/1.6 var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
textarea.en,input.en{font-family:var(--f-read);font-size:16px}
select{width:auto}

.prompt{font-family:var(--f-read);font-size:19px;line-height:1.45}
.prompt .ko{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:4px}
.passage{font-family:var(--f-read);font-size:17px;line-height:1.75}
.passage p{margin:0 0 .8em}
mark{background:color-mix(in srgb,var(--hl) 45%,transparent);color:inherit;padding:0 2px;border-radius:2px}

.fix{display:grid;gap:4px;padding:10px 0;border-top:1px dashed var(--line)}
.fix:first-child{border-top:0}
.fix .pair{font-family:var(--f-read);font-size:16px}
.wrong{color:var(--pen);text-decoration:line-through;text-decoration-thickness:1.5px}
.right{color:var(--ok);font-weight:600}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);vertical-align:2px}
.score{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:14px;color:var(--muted);font-family:var(--f-body)}
.model{font-family:var(--f-read);font-size:16px;background:var(--paper);border-radius:10px;padding:12px}

.tasks{display:grid;gap:2px}
.task{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;width:100%}
.task:first-child{border-top:0}
.box{flex:0 0 22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:14px;color:var(--accent-ink)}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .m{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

.streak{display:flex;gap:4px}
.streak span{width:14px;height:14px;border-radius:4px;background:var(--line)}
.streak span.on{background:var(--ok)}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--paper);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{margin-top:5px}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.incorrect{border-color:var(--pen);background:color-mix(in srgb,var(--pen) 8%,transparent)}
.word-ok{color:var(--ok)} .word-miss{color:var(--pen);text-decoration:underline wavy}
.notice{font-size:13px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--hl) 22%,transparent)}
.err{color:var(--pen);font-size:14px}
.thinking{color:var(--muted);font-size:14px}
.thinking::after{content:"";display:inline-block;width:1em;animation:dots 1.2s steps(4) infinite;text-align:left}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"..."}}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px}
.tile .score{font-size:28px}
.bars.stat .bar{grid-template-columns:70px 1fr auto}
details.rec{border-top:1px solid var(--line);padding:10px 0}
details.rec summary{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:500;list-style:none}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rec[open] summary>span:nth-child(2){white-space:normal}
.rec-body{display:grid;gap:12px;padding-top:12px}
.card>*,.quiet>*,.rec-body>*{min-width:0}
details.rec,details.rec summary{min-width:0}
details.rec summary .chip{flex:0 0 auto}
details.rec summary b{flex:0 0 auto;white-space:nowrap}
.model,.passage,.pair{overflow-wrap:anywhere}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){h1{font-size:24px}.bar{grid-template-columns:86px 1fr 24px}}
</style>

<div class="wrap">
  <header class="top">
    <h1><small>하루 15분, 내 실수에서 시작하는</small>매일 영어 노트</h1>
    <div class="status" id="status"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script>
(function(){
"use strict";
/* ---------- built-in content (used when Claude is not available, and as day-one examples) ---------- */
const WRITE_PROMPTS=[
  {en:"Describe your last weekend in 5–6 sentences.",ko:"지난 주말을 5~6문장으로 써 보세요."},
  {en:"Write a short message to a parent about their child's progress this month.",ko:"학부모에게 이번 달 아이의 성장에 대해 짧은 메시지를 써 보세요."},
  {en:"What is one thing you want to get better at next year, and why?",ko:"내년에 더 잘하고 싶은 한 가지와 그 이유는?"},
  {en:"Explain your favorite Korean food to a friend who has never tried it.",ko:"좋아하는 한국 음식을 처음 먹어 보는 친구에게 설명해 보세요."},
  {en:"Write a polite email asking a coworker to switch lunch duty with you.",ko:"동료에게 급식 지도 당번을 바꿔 달라는 정중한 이메일을 써 보세요."},
  {en:"How do you usually spend your money? Describe one smart habit and one bad habit.",ko:"평소 돈 쓰는 습관 중 좋은 습관 하나, 고치고 싶은 습관 하나를 써 보세요."},
  {en:"Tell me about a time a student surprised you.",ko:"학생 때문에 놀랐던(감동한) 경험을 써 보세요."}
];
const SPEAK_QS=[
  {en:"What did you do after work yesterday?",ko:"어제 퇴근 후에 뭐 했어요?"},
  {en:"What's the best part of being a teacher?",ko:"교사로서 가장 좋은 점은?"},
  {en:"If you had a free day tomorrow, how would you spend it?",ko:"내일 하루가 통째로 비면 뭘 하고 싶어요?"},
  {en:"Tell me about an app or tool you use every day.",ko:"매일 쓰는 앱이나 도구를 소개해 주세요."},
  {en:"What's something you're saving money for?",ko:"요즘 돈을 모으고 있는 목표가 있나요?"},
  {en:"Describe your neighborhood to someone visiting for the first time.",ko:"처음 오는 사람에게 우리 동네를 소개해 주세요."},
  {en:"What is a skill you learned recently?",ko:"최근에 배운 기술이나 습관이 있나요?"}
];
const SAMPLE_LISTEN={title:"A Busy Monday",sample:true,
  text:"Every Monday, Mina wakes up at six thirty. She drinks a glass of water and checks the weather before she leaves. Her school is only fifteen minutes away, so she usually walks. On the way, she listens to a short English podcast. This Monday, it started to rain halfway there. She didn't have an umbrella, so she stopped at a convenience store and bought one. She arrived at school a little late, but her students were already reading quietly. She was proud of them.",
  dictation:"She didn't have an umbrella, so she stopped at a convenience store and bought one.",
  questions:[
    {q:"How does Mina usually get to school?",options:["By bus","She walks","She drives","By bike"],answer:1,why_ko:"\"so she usually walks\" — 보통 걸어서 가요."},
    {q:"What happened on the way this Monday?",options:["She lost her phone","It started to rain","She met a student","The store was closed"],answer:1,why_ko:"\"it started to rain halfway there\" — 가는 도중에 비가 왔어요."},
    {q:"How did Mina feel at the end?",options:["Angry","Tired","Proud","Worried"],answer:2,why_ko:"\"She was proud of them\" — 학생들이 자랑스러웠어요."}
  ]};
const SAMPLE_READ={title:"The 1% Rule",sample:true,
  text:"Many people try to change their lives all at once. They plan to wake up early, exercise every day, and study for two hours. After a week, most of them give up.\n\nThe \"1% rule\" suggests a different approach. Instead of making a big change, you improve one small thing by about one percent each day. For example, you might read one page of an English book, or save the price of one coffee.\n\nThese changes feel too small to matter. However, small actions repeated for a long time can add up. The key is not intensity but consistency. If a habit is easy enough to do on a bad day, you are more likely to keep it.",
  vocab:[{word:"approach",ko:"접근 방식"},{word:"add up",ko:"쌓이다, 합쳐지다"},{word:"intensity",ko:"강도, 세기"},{word:"consistency",ko:"꾸준함, 일관성"}],
  questions:[
    {q:"Why do many people give up after a week?",options:["They try to change too much at once","They don't have money","They are too busy at work","They don't like books"],answer:0,why_ko:"한꺼번에 너무 많이 바꾸려다 포기한다고 해요."},
    {q:"Which is an example of the 1% rule?",options:["Studying for two hours","Reading one page a day","Exercising every day","Waking up at 5 a.m."],answer:1,why_ko:"\"read one page of an English book\"가 예시예요."},
    {q:"According to the text, what matters most?",options:["Intensity","Speed","Consistency","Talent"],answer:2,why_ko:"\"The key is not intensity but consistency.\""}
  ]};
const ERROR_TYPES=["시제","관사(a/the)","전치사","단어 선택","어순","주어-동사 일치","단수/복수","직역·콩글리시","문장 연결","자연스러움","철자·구두점"];

/* ---------- state ----------
   S   = small settings/progress doc (level, streak, focus, review progress)
   LOG = every practice session, kept forever: one entry per day {d, records:[...]}
   ERR = every mistake from every session (derived from LOG) */
const LS_KEY="daily-english-notebook-v1", LS_LOG="daily-english-notebook-log-v1";
function blank(){return{v:2,level:"B1",streak:{last:"",count:0},days:{},focus:null,drillDone:{},rv:{}}}
let S=blank(), LOG={}, ERR=[];
let tab="today", sample=null, aiChecked=false, progRef=null, dayCol=null, store="device";
const scratch={}; // per-session view state (current listening/reading set, answers, feedback)
const dirty=new Set();
let cloudPending=!!(window.claude&&typeof window.claude.use==="function");

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayIndex(){return Math.floor(Date.now()/864e5)}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function merge(d){const b=blank();if(!d||typeof d!=="object")return b;return Object.assign(b,JSON.parse(JSON.stringify(d)))}
function cut(v,n){return v==null?"":String(v).slice(0,n)}

try{const raw=localStorage.getItem(LS_KEY);if(raw)S=merge(JSON.parse(raw))}catch(e){}
try{const raw=localStorage.getItem(LS_LOG);if(raw)LOG=JSON.parse(raw)||{}}catch(e){}

function putRecord(r){
  LOG[r.d]=LOG[r.d]||{d:r.d,records:[]};
  if(LOG[r.d].records.some(x=>x.ts===r.ts))return false;
  LOG[r.d].records.push(r);LOG[r.d].records.sort((a,b)=>a.ts-b.ts);dirty.add(r.d);return true;
}
function rebuildErr(){
  ERR=[];
  for(const d of Object.keys(LOG).sort())for(const r of LOG[d].records||[])for(const e of r.errors||[])ERR.push({...e,d,skill:r.skill});
  scratch.rvPick=null;
}
function cleanErrors(list){
  return (Array.isArray(list)?list:[]).filter(e=>e&&e.wrong&&e.right).slice(0,10).map(e=>({type:ERROR_TYPES.includes(e.type)?e.type:"자연스러움",wrong:cut(e.wrong,200),right:cut(e.right,200),why:cut(e.why,240)}));
}
function addRecord(rec){
  rec.ts=Date.now();rec.d=today();
  for(const k of ["text","corrected","natural"])if(rec[k]!=null)rec[k]=cut(rec[k],1500);
  if(rec.title!=null)rec.title=cut(rec.title,200);
  rec.errors=cleanErrors(rec.errors);
  putRecord(rec);rebuildErr();save();
}
// v1 kept only the last 150 mistakes and 40 short history lines inside S: move them into LOG
function migrateLegacy(){
  const errs=Array.isArray(S.errors)?S.errors:[], hist=Array.isArray(S.history)?S.history:[];
  delete S.errors;delete S.history;
  if(!errs.length&&!hist.length)return false;
  const groups={};
  for(const e of errs){const k=e.d+"|"+e.skill;(groups[k]=groups[k]||[]).push(e)}
  const recs=hist.map((h,i)=>{const quiz=h.skill==="listening";return{ts:Date.parse(h.d)+i,d:h.d,skill:h.skill,title:quiz?h.text:"",text:quiz?"":h.text,score:h.score,errors:[]}});
  for(const r of recs){const k=r.d+"|"+r.skill;if(groups[k]&&r.skill!=="listening"){r.errors=cleanErrors(groups[k]);delete groups[k]}}
  let n=0;for(const k in groups){const [d,skill]=k.split("|");recs.push({ts:Date.parse(d)+500+(n++),d,skill,title:"이전 기록",text:"",score:null,errors:cleanErrors(groups[k])})}
  for(const r of recs)putRecord(r);
  return true;
}
if(migrateLegacy()){try{localStorage.setItem(LS_KEY,JSON.stringify(S));localStorage.setItem(LS_LOG,JSON.stringify(LOG))}catch(e){}}
rebuildErr();

let saveTimer=null, saving=false, saveAgain=false;
function save(){
  const keys=Object.keys(S.days).sort();if(keys.length>400)for(const k of keys.slice(0,keys.length-400))delete S.days[k];
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  try{localStorage.setItem(LS_LOG,JSON.stringify(LOG))}catch(e){}
  if(!progRef)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving){saveAgain=true;return}
  saving=true;
  try{
    await progRef.set(JSON.parse(JSON.stringify(S)));
    for(const d of [...dirty]){
      dirty.delete(d);
      try{await dayCol.doc(d).set(JSON.parse(JSON.stringify(LOG[d])))}catch(e){dirty.add(d);throw e}
    }
    scratch.saveErr="";
  }catch(e){console.warn("save failed",e);scratch.saveErr=e&&e.code==="quota_exceeded"?"저장 공간이 가득 찼어요.":"계정에 저장하지 못했어요. 이 기기에는 저장돼 있고, 다음 연습 때 다시 올려요."}
  saving=false;if(saveAgain){saveAgain=false;flush()}
}

function markDone(key){
  const t=today();S.days[t]=S.days[t]||{};
  if(!S.days[t][key]){S.days[t][key]=true}
  if(S.streak.last!==t){S.streak.count=(S.streak.last===addDays(t,-1))?S.streak.count+1:1;S.streak.last=t}
  save();
}
function errKey(e){return norm(e.wrong).join(" ")}
function isMastered(e){return (S.rv[errKey(e)]?.ok||0)>=2}

/* ---------- Claude ---------- */
function weakSpots(){
  const recent=ERR.slice(-60);const c={};for(const e of recent)c[e.type]=(c[e.type]||0)+1;
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  const habits=(S.focus?.habits||[]).map(h=>h.title_ko).filter(Boolean);
  return [...habits,...top].slice(0,5).join(", ")||"(아직 기록 없음)";
}
function learner(){return `The learner is a 29-year-old Korean elementary school teacher whose English has gotten rusty. Target level: CEFR ${S.level}. Their recurring weak points so far: ${weakSpots()}. Write every explanation in short, plain Korean (no jargon; if you must use a grammar term, add a simple Korean gloss in parentheses).`}
async function askJSON(prompt,tier){
  if(!sample)throw{code:"no_ai"};
  return sample.json(prompt,{modelTier:tier||"default"});
}
function errText(e){
  switch(e&&e.code){
    case "no_ai":return "AI 피드백은 Claude 앱(또는 claude.ai)에서 이 페이지를 열었을 때만 동작해요. 지금은 예시 문제와 스스로 채점만 쓸 수 있어요.";
    case "not_granted":return "Claude 사용을 허락하지 않아서 피드백을 받을 수 없어요. 페이지를 새로 열면 다시 물어봐요.";
    case "rate_limited":return "잠깐 사이에 요청이 많았어요. 1분쯤 뒤에 다시 눌러 주세요.";
    case "invalid_json":return "답을 정리하지 못했어요. 버튼을 한 번 더 눌러 주세요.";
    case "cancelled":return "요청을 멈췄어요.";
    default:return "피드백을 받지 못했어요. 잠시 후 다시 눌러 주세요."+(e&&e.code?` (${e.code})`:"");
  }
}

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google|Jenny|Aria/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text,rate){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate||1;speechSynthesis.speak(u);return true}catch(e){return false}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function startDictation(onText,onState){
  if(!Rec){onState("unsupported");return}
  try{
    rec=new Rec();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;
    const base=scratch.sText?scratch.sText.trim()+" ":"";
    rec.onresult=ev=>{let s="";for(const r of ev.results)s+=r[0].transcript;onText(base+s)};
    rec.onerror=ev=>onState(ev.error==="not-allowed"||ev.error==="service-not-allowed"?"blocked":"error");
    rec.onend=()=>onState("stopped");
    rec.start();onState("listening");
  }catch(e){onState("blocked")}
}
function stopDictation(){try{rec&&rec.stop()}catch(e){}}

function skillKo(s){return({writing:"쓰기",speaking:"말하기",reading:"읽기 요약",listening:"듣기"})[s]||s}
function reviewCards(){
  if(!scratch.rvPick){
    // every mistake not yet graduated; least-recently reviewed first, then oldest first
    const seen=new Set(),pool=[];
    for(const e of ERR){const k=errKey(e);if(!k||seen.has(k)||isMastered(e))continue;seen.add(k);pool.push(e)}
    pool.sort((a,b)=>(S.rv[errKey(a)]?.last||"").localeCompare(S.rv[errKey(b)]?.last||"")||a.d.localeCompare(b.d));
    scratch.rvPick=pool.slice(0,3);
  }
  return scratch.rvPick;
}

async function feedback(key,skill,task,text,title){
  scratch[key]={loading:true};render();
  const spoken=skill==="speaking";
  const prompt=`${learner()}

You are a warm but precise English tutor. ${spoken?"The learner SPOKE this answer out loud (it may be a speech-to-text transcript, so ignore capitalization and punctuation; focus on grammar, word choice, natural spoken phrasing, filler words and overly long or choppy sentences).":"The learner WROTE this text."}
Task given to the learner: ${task}
Learner's answer:
<<<
${text.slice(0,4000)}
>>>
Korean words inside the answer mean the learner did not know the English word: give the English for them as errors of type "단어 선택".

Reply with only JSON in this shape:
{"score": 0-100 integer (how clear and correct for level ${S.level}),
 "good_ko": "one Korean sentence on what they did well",
 "errors": [{"wrong":"exact phrase copied from the answer","right":"corrected phrase","type":"one of ${ERROR_TYPES.join(" | ")}","why":"one short Korean sentence"}],
 "corrected": "their answer with only the mistakes fixed",
 "natural": "how a native speaker would ${spoken?"say":"write"} the same idea, at about level ${S.level}",
 "expressions": [{"en":"useful phrase from natural version","ko":"Korean meaning","example":"short example sentence"}],
 "tip_ko": "one concrete thing to try next time, in Korean"}
List at most 8 errors, most important first. 2-3 expressions.`;
  try{
    const r=await askJSON(prompt,"default");
    const errs=Array.isArray(r.errors)?r.errors:[];
    addRecord({skill,title:title||task,text,score:typeof r.score==="number"?r.score:null,errors:errs,corrected:r.corrected,natural:r.natural,good:cut(r.good_ko,300),tip:cut(r.tip_ko,300),expressions:(Array.isArray(r.expressions)?r.expressions:[]).slice(0,4).map(x=>({en:cut(x.en,120),ko:cut(x.ko,120),example:cut(x.example,240)}))});
    markDone(skill);
    scratch[key]={html:fbHtml(r,spoken)};
  }catch(e){scratch[key]={error:errText(e)}}
  render();
}

function qHtml(px,q,i,ans,sub){
  return `<div class="quiet"><p style="margin:0"><b>${i+1}.</b> ${esc(q.q)}</p>
    ${q.options.map((o,j)=>{const cls=sub?(j===q.answer?"correct":(ans===j?"incorrect":"")):"";
      return `<label class="opt ${cls}"><input type="radio" name="${px}q${i}" data-q="${px}" data-i="${i}" value="${j}" ${ans===j?"checked":""} ${sub?"disabled":""}><span>${esc(o)}</span></label>`}).join("")}
    ${sub?`<p class="small muted" style="margin:0">${ans===q.answer?'<b class="right">정답</b> · ':""}${esc(q.why_ko)}</p>`:""}</div>`;
}
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean)}
function dictCheck(user,target){
  const bag={};for(const w of norm(user))bag[w]=(bag[w]||0)+1;
  const parts=target.split(/\s+/).filter(Boolean).map(raw=>{const w=norm(raw)[0];const ok=!!(w&&bag[w]);if(ok)bag[w]--;return{raw,ok}});
  return{parts,hit:parts.filter(p=>p.ok).length,total:parts.length};
}
function dictHtml(user,target){
  const r=dictCheck(user,target);
  return `<p style="font-family:var(--f-read);font-size:16px;margin:0">${r.parts.map(p=>`<span class="${p.ok?"word-ok":"word-miss"}">${esc(p.raw)}</span>`).join(" ")}</p><p class="small muted" style="margin:0">${r.total}단어 중 ${r.hit}단어를 맞게 들었어요. 물결 밑줄이 놓친 단어예요.</p>`;

async function newSet(kind){
  const isL=kind==="listen";
  scratch[isL?"lLoading":"rLoading"]=true;scratch[isL?"lErr":"rErr"]="";render();
  const topics=["school life","money and saving","travel","food","health habits","technology and AI","weekend plans","friendship","work-life balance","learning a skill"];
  const topic=topics[(dayIndex()+Math.floor(Math.random()*topics.length))%topics.length];
  const prompt=isL?`${learner()}
Create one short listening exercise about "${topic}". The script will be read aloud by text-to-speech, so use plain sentences, no headings or lists, ${S.level==="A2"?"60-80":S.level==="B1"?"80-110":"110-140"} words, everyday spoken English at level ${S.level}. Where it fits naturally, reuse grammar the learner struggles with (correctly) so they hear it modeled.
Reply with only JSON: {"title":"short English title","text":"the script","dictation":"one sentence copied exactly from the script, 10-16 words","questions":[{"q":"English question","options":["4 short English options"],"answer":index 0-3,"why_ko":"Korean explanation quoting the key phrase"}]} with exactly 3 questions.`
  :`${learner()}
Write one short reading passage about "${topic}" at level ${S.level}, ${S.level==="A2"?"100-130":S.level==="B1"?"150-190":"200-240"} words, 2-3 paragraphs separated by a blank line (\\n\\n). Interesting to an adult, practical. Where it fits naturally, use (correctly) the grammar the learner struggles with.
Reply with only JSON: {"title":"English title","text":"the passage","vocab":[{"word":"word or phrase from the passage","ko":"Korean meaning"}] (4-5 items),"questions":[{"q":"English question","options":["4 options"],"answer":index 0-3,"why_ko":"Korean explanation"}]} with exactly 3 questions.`;
  try{
    const r=await askJSON(prompt,"default");
    if(!r||!r.text||!Array.isArray(r.questions)||!r.questions.length)throw{code:"invalid_json"};
    r.questions=r.questions.filter(q=>Array.isArray(q.options)&&q.options.length>=2).map(q=>({...q,answer:Math.max(0,Math.min(q.options.length-1,parseInt(q.answer,10)||0))}));
    if(isL){scratch.listen=r;scratch.lAns={};scratch.lSub=false;scratch.lDict=""}
    else{scratch.read=r;scratch.rAns={};scratch.rSub=false;scratch.rSum="";delete scratch.r}
  }catch(e){scratch[isL?"lErr":"rErr"]=errText(e)}
  scratch[isL?"lLoading":"rLoading"]=false;render();
}

  <div class="card"><h3>내용 문제</h3>${R.questions.map((q,i)=>qHtml("r",q,i,a[i],sub)).join("")}
    <div class="row">${sub?`<button class="btn" data-act="r-reset">다시 풀기</button>`:`<button class="btn primary" data-act="r-submit">채점하기</button>`}</div></div>

async function analyze(){
  scratch.pat={loading:true};render();
  const list=ERR.slice(-120).map(e=>`[${e.type}] ${e.wrong} -> ${e.right}`).join("\n");
  const prompt=`${learner()}
Here are the learner's recent English mistakes (wrong -> right), from writing and speaking practice:
${list}

Find the 3 habits that, if fixed, would improve their English the most. Look for the Korean-speaker root cause (e.g. Korean has no articles, so "a/the" get dropped). Then make a 7-day plan, each day doable in about 15 minutes with this app's tools (쓰기, 말하기, 듣기, 읽기, 오답 복습).
Reply with only JSON:
{"summary_ko":"one or two Korean sentences diagnosing their overall pattern, kind and direct",
 "habits":[{"title_ko":"short Korean name of the habit","why_ko":"why a Korean speaker does this, with a real-life comparison","rule_ko":"the simple rule to remember","wrong_example":"a sentence from their own mistakes","right_example":"the corrected sentence","mini_drill":[{"prompt_ko":"Korean sentence to translate or a fill-in task","answer_en":"model answer"}]}],
 "plan_ko":["7 short Korean lines, one per day, e.g. '쓰기: 어제 한 일 5문장 — 과거형 동사에 밑줄 치며 쓰기'"]}
Exactly 3 habits, each with 3 mini_drill items.`;
  try{
    const r=await askJSON(prompt,"complex");

    save();scratch.pat=null;
  }catch(e){scratch.pat={error:errText(e)}}

/* history */
const SKILLS=[["all","전체"],["writing","쓰기"],["speaking","말하기"],["listening","듣기"],["reading","읽기"]];
function allRecords(){const out=[];for(const d of Object.keys(LOG).sort())for(const r of LOG[d].records||[])out.push(r);return out}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}
function trendSvg(recs,label){
  const pts=recs.filter(r=>typeof r.score==="number").slice(-20);
  if(pts.length<2)return `<p class="small muted">${label}: 두 번 이상 하면 점수 변화가 그려져요.</p>`;
  const W=340,H=130,L=26,B=20,T=14,bw=(W-L-8)/pts.length;
  const y=v=>T+(H-T-B)*(1-v/100);
  let g="";for(const v of [0,50,100])g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const bars=pts.map((r,i)=>{const x=L+4+i*bw,h=(H-T-B)*(r.score/100);const last=i===pts.length-1;
    return `<rect x="${x}" y="${y(r.score)}" width="${Math.max(2,bw-4)}" height="${h}" rx="2" fill="${last?"var(--accent)":"color-mix(in srgb,var(--accent) 40%,transparent)"}"><title>${esc(r.d)} · ${r.score}점</title></rect>${last?`<text x="${x+(bw-4)/2}" y="${y(r.score)-4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${r.score}</text>`:""}`}).join("");
  const first=avg(pts.slice(0,Math.ceil(pts.length/2)).map(r=>r.score)),second=avg(pts.slice(Math.ceil(pts.length/2)).map(r=>r.score));
  const diff=second-first;
  return `<div class="quiet"><div class="row between"><span class="small"><b>${label}</b> 최근 ${pts.length}번</span><span class="small ${diff>=0?"right":"wrong"}" style="text-decoration:none">${diff>=0?"▲":"▼"} 앞쪽 평균보다 ${Math.abs(diff)}점 ${diff>=0?"올랐어요":"내렸어요"}</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label} 점수 변화">${g}${bars}<text x="${L+4}" y="${H-5}" font-size="11" fill="var(--muted)">${esc(pts[0].d.slice(5))}</text><text x="${W-4}" y="${H-5}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(pts[pts.length-1].d.slice(5))}</text></svg></div>`;
}
function recordHtml(r){
  const head=`<span class="chip">${esc(skillKo(r.skill))}</span> <span>${esc(r.title||cut(r.text,50))}</span>${typeof r.score==="number"?` <b style="margin-left:auto;font-variant-numeric:tabular-nums">${r.score}점</b>`:""}`;
  let body="";
  if(r.text)body+=`<div class="quiet"><div class="eyebrow">내 답</div><div class="model">${esc(r.text)}</div></div>`;
  if(r.errors?.length)body+=`<div class="quiet"><div class="eyebrow">고칠 곳 ${r.errors.length}개</div>${r.errors.map(e=>`<div class="fix"><div class="pair"><span class="wrong">${esc(e.wrong)}</span> → <span class="right">${esc(e.right)}</span></div><div class="small"><span class="chip">${esc(e.type)}</span> ${esc(e.why)}${isMastered(e)?' <span class="right">· 졸업</span>':""}</div></div>`).join("")}</div>`;
  if(r.corrected)body+=`<div class="quiet"><div class="eyebrow">고친 문장</div><div class="model">${esc(r.corrected)}</div></div>`;
  if(r.natural)body+=`<div class="quiet"><div class="row between"><div class="eyebrow">원어민이라면</div><button class="btn" data-speak="${esc(r.natural)}">▶ 듣기</button></div><div class="model">${esc(r.natural)}</div></div>`;
  if(r.expressions?.length)body+=`<div class="quiet"><div class="eyebrow">챙겨 갈 표현</div>${r.expressions.map(x=>`<div><mark>${esc(x.en)}</mark> <span class="small muted">${esc(x.ko)}</span></div>`).join("")}</div>`;
  if(r.total)body+=`<p>문제 ${r.total}개 중 <b>${r.correct}개</b> 맞힘</p>${(r.wrong||[]).map(w=>`<div class="fix small"><div>${esc(w.q)}</div><div>내 답 <span class="${w.mine==="(안 고름)"?"muted":"wrong"}">${esc(w.mine)}</span> · 정답 <span class="right">${esc(w.right)}</span></div></div>`).join("")}`;
  if(r.dictation&&r.dictation.total)body+=`<div class="quiet"><div class="eyebrow">받아쓰기 ${r.dictation.hit}/${r.dictation.total}단어</div>${dictHtml(r.dictation.mine||"",r.dictation.sentence||"")}</div>`;
  if(r.vocab?.length)body+=`<div class="small">${r.vocab.map(v=>`<mark>${esc(v.word)}</mark> ${esc(v.ko)}`).join(" · ")}</div>`;
  if(r.tip)body+=`<p class="notice">${esc(r.tip)}</p>`;
  return `<details class="rec"><summary>${head}</summary><div class="rec-body">${body||'<p class="small muted">이전 버전에서 옮겨 온 기록이라 자세한 내용은 없어요.</p>'}</div></details>`;
}
function vHistory(){
  const all=allRecords();
  const f=scratch.hFilter||"all";
  const studyDays=new Set([...Object.keys(LOG).filter(d=>LOG[d].records?.length),...Object.keys(S.days).filter(d=>Object.keys(S.days[d]||{}).length)]).size;
  const uniq=new Map();for(const e of ERR){const k=errKey(e);if(k)uniq.set(k,e)}
  const mastered=[...uniq.values()].filter(isMastered).length;
  const per=SKILLS.slice(1).map(([k,l])=>{const rs=all.filter(r=>r.skill===k);const sc=rs.filter(r=>typeof r.score==="number").map(r=>r.score);return `<div class="bar"><span>${l}</span><span>${rs.length}번</span><span class="n" style="text-align:right">${sc.length?"평균 "+avg(sc)+"점":"–"}</span></div>`}).join("");
  const shown=all.filter(r=>f==="all"||r.skill===f).reverse();
  const limit=scratch.hLimit||20;
  const groups=[];for(const r of shown.slice(0,limit)){const g=groups[groups.length-1];if(g&&g.d===r.d)g.items.push(r);else groups.push({d:r.d,items:[r]})}
  const first=all[0]?.d;
  return `
  <section class="quiet"><h2>쌓인 기록</h2>
    <p class="small muted">푼 문제와 받은 피드백이 날짜별로 모두 저장돼요. 지우지 않는 한 계속 쌓여요.${first?` 첫 기록: ${esc(first)}`:""}</p></section>
  <div class="tiles">
    <div class="tile"><span class="score">${studyDays}</span><span class="small muted">공부한 날</span></div>
    <div class="tile"><span class="score">${all.length}</span><span class="small muted">연습한 횟수</span></div>
    <div class="tile"><span class="score">${uniq.size}</span><span class="small muted">모인 오답</span></div>
    <div class="tile"><span class="score">${mastered}</span><span class="small muted">졸업한 오답</span></div>
  </div>
  <div class="card"><h3>영역별</h3><div class="bars stat">${per}</div></div>
  <div class="card"><h3>점수 변화</h3>
    ${trendSvg(all.filter(r=>r.skill==="writing"||r.skill==="speaking"||(r.skill==="reading"&&r.text)),"쓰기·말하기·요약")}
    ${trendSvg(all.filter(r=>r.total),"듣기·읽기 문제 정답률")}
  </div>
  <div class="card">
    <div class="row" role="group" aria-label="영역 골라 보기">${SKILLS.map(([k,l])=>`<button class="btn ${f===k?"primary":""}" data-hfilter="${k}">${l}</button>`).join("")}</div>
    ${groups.length?groups.map(g=>`<div class="quiet"><div class="eyebrow">${esc(g.d)}</div>${g.items.map(recordHtml).join("")}</div>`).join(""):cloudPending?`<p class="thinking">내 계정에서 기록을 불러오는 중</p>`:`<p class="muted">아직 기록이 없어요. 쓰기·말하기 피드백을 받거나 듣기·읽기 문제를 채점하면 여기에 쌓여요.</p>`}
    ${shown.length>limit?`<button class="btn" data-act="h-more">이전 기록 더 보기 (${shown.length-limit}개 남음)</button>`:""}
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="w-text"){scratch.wText=t.value;const c=document.getElementById("w-count");if(c)c.textContent=wc(t.value)+"단어"}
  else if(t.id==="s-text")scratch.sText=t.value;
  else if(t.id==="l-dict")scratch.lDict=t.value;
  else if(t.id==="r-sum")scratch.rSum=t.value;
  else if(t.id==="drill-in")scratch.drill=t.value;
  else if(t.id&&t.id.startsWith("rv-in-")){const i=t.id.slice(6);scratch["rv"+i]={...(scratch["rv"+i]||{}),val:t.value}}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="level"){S.level=t.value;save();renderStatus()}
  if(t.dataset&&t.dataset.q){const k=t.dataset.q==="l"?"lAns":"rAns";scratch[k]=scratch[k]||{};scratch[k][t.dataset.i]=Number(t.value)}
});
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,[data-go]");if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.hfilter){scratch.hFilter=b.dataset.hfilter;scratch.hLimit=20;render();return}
  if(b.dataset.go){if(b.dataset.go==="today-review"){document.getElementById("review")?.scrollIntoView({behavior:"smooth"});return}return go(b.dataset.go)}
  if(b.dataset.speak!==undefined){speak(b.dataset.speak,Number(b.dataset.rate)||0.95);return}
  if(b.dataset.speakText){const src=b.dataset.speakText==="listen"?scratch.listen:scratch.read;speak(src.text.replace(/\n+/g," "),Number(b.dataset.rate)||1);return}
  const a=b.dataset.act;if(!a)return;
  switch(a){
    case "stop":stopSpeak();break;
    case "w-next":scratch.wPrompt=WRITE_PROMPTS[(WRITE_PROMPTS.indexOf(scratch.wPrompt)+1)%WRITE_PROMPTS.length];delete scratch.w;render();break;
    case "s-next":scratch.sQ=SPEAK_QS[(SPEAK_QS.indexOf(scratch.sQ)+1)%SPEAK_QS.length];delete scratch.s;render();break;
    case "w-submit":{const tx=(scratch.wText||"").trim();if(wc(tx)<3){scratch.w={error:"세 단어 이상 써 주세요."};render();break}feedback("w","writing",scratch.wPrompt.en,tx,scratch.wPrompt.en);break}
    case "s-submit":{stopDictation();const tx=(scratch.sText||"").trim();if(wc(tx)<3){scratch.s={error:"말한 내용을 세 단어 이상 넣어 주세요."};render();break}feedback("s","speaking","Answer this question out loud: "+scratch.sQ.en,tx,scratch.sQ.en);break}
    case "r-sum-submit":{const tx=(scratch.rSum||"").trim();if(wc(tx)<3){scratch.r={error:"세 단어 이상 써 주세요."};render();break}feedback("r","reading",`Summarize this passage in 1-2 sentences. Also judge whether the summary captures the main idea and mention it in good_ko/tip_ko.\nPassage: ${scratch.read.text}`,tx,"요약: "+scratch.read.title);break}
    case "mic-start":startDictation(t=>{scratch.sText=t;const ta=document.getElementById("s-text");if(ta)ta.value=t},st=>{scratch.micState=st;if(tab==="speaking")render()});break;
    case "mic-stop":stopDictation();break;
    case "l-new":newSet("listen");break;
    case "r-new":newSet("read");break;
    case "l-submit":{const L=scratch.listen;scratch.lSub=true;const dc=dictCheck(scratch.lDict||"",L.dictation);
      addRecord({skill:"listening",title:L.title,...quizResult(L,scratch.lAns),dictation:{sentence:cut(L.dictation,300),mine:cut(scratch.lDict,300),hit:dc.hit,total:dc.total}});markDone("listening");render();break}
    case "r-submit":{const R2=scratch.read;scratch.rSub=true;
      addRecord({skill:"reading",title:R2.title,...quizResult(R2,scratch.rAns),vocab:(R2.vocab||[]).slice(0,6)});markDone("reading");render();break}
    case "l-reset":scratch.lSub=false;scratch.lAns={};scratch.lDict="";render();break;
    case "r-reset":scratch.rSub=false;scratch.rAns={};render();break;
    case "analyze":analyze();break;
    case "h-more":scratch.hLimit=(scratch.hLimit||20)+20;render();break;
    case "drill-check":scratch.drillShown=true;S.drillDone[b.dataset.dk]=true;save();render();break;
    case "rv-check":{const i=b.dataset.i;const e=reviewCards()[i];const r=scratch["rv"+i]||{};const match=norm(r.val||"").join(" ")===norm(e.right).join(" ");scratch["rv"+i]={...r,shown:true,match};
      if(!r.shown){const k=errKey(e),prev=S.rv[k]||{ok:0};S.rv[k]={last:today(),ok:match?(prev.last===today()?prev.ok:prev.ok+1):0};save()}
      const shownAll=reviewCards().every((_,k)=>scratch["rv"+k]?.shown);if(shownAll)markDone("review");render();break}
  }
});
function quizResult(set,ans){
  ans=ans||{};let c=0;const wrong=[];
  set.questions.forEach((q,i)=>{if(ans[i]===q.answer)c++;else wrong.push({q:cut(q.q,200),mine:ans[i]==null?"(안 고름)":cut(q.options[ans[i]],120),right:cut(q.options[q.answer],120)})});
  return{score:Math.round(c/set.questions.length*100),correct:c,total:set.questions.length,wrong};
}

/* ---------- boot ---------- */
render();
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("sample").then(s=>{sample=s;aiChecked=true;render()}).catch(()=>{aiChecked=true;render()});
  (async()=>{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const pRef=db.collection("data/users/"+id).doc("progress");
    const dCol=pRef.collection("days");
    const [snap,q]=await Promise.all([pRef.get(),dCol.orderBy("d","desc").limit(1000).get()]);
    const localS=S,localLOG=LOG;
    if(snap.exists){S=merge(snap.data());S.days=Object.assign({},localS.days,S.days)}
    LOG={};for(const doc of q.docs){const v=doc.data();if(v&&v.d)LOG[v.d]={d:v.d,records:Array.isArray(v.records)?v.records:[]}}
    dirty.clear();
    for(const d in localLOG)for(const r of (localLOG[d].records||[]))putRecord(r); // sessions done on this device before the account was reachable
    migrateLegacy();
    progRef=pRef;dayCol=dCol;store="cloud";
    rebuildErr();
    if(dirty.size||!snap.exists)flush();
    try{localStorage.setItem(LS_KEY,JSON.stringify(S));localStorage.setItem(LS_LOG,JSON.stringify(LOG))}catch(e){}
    render();
  })().catch(e=>console.warn("cloud storage unavailable",e)).finally(()=>{cloudPending=false;render()});
}else{aiChecked=true;render()}
})();
</script>
