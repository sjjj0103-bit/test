<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="건강수첩">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- ARTIFACT-START -->
<title>하루 건강수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="영양제·식단·물·카페인·수면·컨디션·생리 주기를 하루 한 번 기록하는 자기관리 수첩">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS-style — slim bar + large title, white grouped cards on light grey, fixed bottom tab bar. One column on phones, two from 820px. */
:root {
  --bg: #F5F5F7;
  --surface: #FFFFFF;
  --sunk: #ECECF0;
  --ink: #1D1D1F;
  --ink2: #424245;
  --muted: #6E6E73;
  --line: #D2D2D7;
  --hair: rgba(0, 0, 0, .09);
  --on-ink: #FFFFFF;
  --thumb: #FFFFFF;
  --bad: #C9001A;
  --bar-bg: rgba(250, 250, 252, .84);
  --shadow: 0 1px 1px rgba(0, 0, 0, .02), 0 6px 20px rgba(0, 0, 0, .05);
  --accent: var(--ink); --on-c: var(--on-ink); --good: var(--ink); --warn: var(--ink2);
  --c-cond: var(--ink); --c-sleep: var(--ink); --c-water: var(--ink); --c-supp: var(--ink); --c-food: var(--ink);
  --c-caf: var(--ink); --c-alc: var(--ink); --c-move: var(--ink); --c-cycle: var(--ink);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --f-num: var(--f-display);
  --r: 20px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --sunk: #2C2C2E; --ink: #F5F5F7; --ink2: #D1D1D6; --muted: #98989D;
    --line: #38383A; --hair: rgba(255, 255, 255, .12); --on-ink: #000000; --thumb: #636366; --bad: #FF6961;
    --bar-bg: rgba(22, 22, 24, .84); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --sunk: #2C2C2E; --ink: #F5F5F7; --ink2: #D1D1D6; --muted: #98989D;
  --line: #38383A; --hair: rgba(255, 255, 255, .12); --on-ink: #000000; --thumb: #636366; --bad: #FF6961;
  --bar-bg: rgba(22, 22, 24, .84); --shadow: none;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--f-body); letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Slim top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bar-bg);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--hair);
}
.top .wrap { padding-block: 0; height: 52px; display: flex; align-items: center; gap: 10px; }
.brand { display: contents; }
.brand h1 { font: 600 17px/1 var(--f-display); margin: 0; letter-spacing: -0.02em; }
.brand .spacer { flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.sync.ok::before { background: var(--ink); }
.sync.saving::before { background: var(--muted); }
.sync.error::before { background: var(--bad); }
.who { position: relative; width: 34px; height: 34px; flex: none; }
.who .av {
  width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--on-ink);
  display: grid; place-items: center; font: 600 14px/1 var(--f-display); pointer-events: none;
}
.who select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; cursor: pointer; }

/* Bottom tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: flex; justify-content: center;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--bar-bg);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--hair);
}
.tabbar button {
  flex: 1 1 0; max-width: 120px; border: 0; background: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0;
  font-size: 10.5px; font-weight: 500; letter-spacing: 0;
}
.tabbar svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.2; }

main.wrap { padding-block: 8px calc(100px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* Large title */
.titlebar { display: flex; align-items: flex-end; gap: 10px; padding-top: 14px; }
.titlebar > div:first-child { flex: 1; min-width: 0; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.large { margin: 0; font: 700 34px/1.15 var(--f-display); letter-spacing: -0.03em; text-wrap: balance; }
.titlebar .row { flex: none; padding-bottom: 4px; }

.iconbtn {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink);
  font-size: 20px; line-height: 1; display: inline-grid; place-items: center; box-shadow: var(--shadow); flex: none;
}
.iconbtn:disabled { opacity: .3; cursor: default; }
.btn {
  border: 0; background: var(--sunk); border-radius: 980px; padding: 10px 18px; min-height: 40px;
  font-size: 15px; font-weight: 500;
}
.btn.primary { background: var(--ink); color: var(--on-ink); font-weight: 600; }
.btn.danger { background: none; color: var(--bad); box-shadow: inset 0 0 0 1px currentColor; }
.btn.small { padding: 6px 14px; min-height: 32px; font-size: 13.5px; }

/* Hero rings */
.hero {
  background: var(--surface); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 128px 1fr; gap: 20px; align-items: center;
}
.hero svg { width: 128px; height: 128px; display: block; }
.hero .ring-track { stroke: var(--sunk); }
.hero .ring { stroke: var(--ink); transition: stroke-dashoffset .5s ease; }
.legend-rows { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.legend-rows div { display: flex; flex-direction: column; min-width: 0; }
.legend-rows small { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.legend-rows small i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.legend-rows b { font: 600 20px/1.2 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.legend-rows b span { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
@media (max-width: 360px) { .hero { grid-template-columns: 1fr; justify-items: center; } }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pill {
  background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.pill small { font-size: 12px; color: var(--muted); }
.pill b { font: 600 17px/1.3 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.pill.bad b { color: var(--bad); }
.pill.empty b { color: var(--muted); font-weight: 500; font-size: 15px; }

/* Cards */
.cards { columns: 1; column-gap: 14px; }
@media (min-width: 820px) { .cards { columns: 2; } }
.card {
  --c: var(--ink);
  break-inside: avoid; margin: 0 0 14px; display: flex; flex-direction: column; gap: 14px;
  background: var(--surface); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0;
}
.card > header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h2 { margin: 0; font: 700 21px/1.25 var(--f-display); letter-spacing: -0.025em; }
.card header .meta { margin-left: auto; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sub { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 -6px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 130px; }
.field > span { font-size: 13px; color: var(--muted); }
.card > .field, .card > .row > .field { flex: none; width: 100%; }
.field input, .field select, .field textarea, textarea.note, .meals input {
  width: 100%; border: 0; background: var(--sunk); border-radius: 12px; padding: 11px 12px;
  min-width: 0; font-size: 16px; min-height: 44px;
}
.field input:focus, textarea.note:focus, .meals input:focus { outline: 2px solid var(--ink); outline-offset: 0; }
textarea { resize: vertical; min-height: 72px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--ink); }

/* Segmented control */
.scale { display: flex; background: var(--sunk); border-radius: 11px; padding: 2px; }
.scale button {
  flex: 1 1 0; min-width: 0; border: 0; background: none; border-radius: 9px;
  padding: 7px 2px; min-height: 36px; font-size: 13px; line-height: 1.2; color: var(--ink);
}
.scale button.on { background: var(--thumb); box-shadow: 0 2px 6px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 0; background: var(--sunk); border-radius: 980px; padding: 7px 14px; font-size: 14px; min-height: 34px;
}
.chip.on { background: var(--ink); color: var(--on-ink); font-weight: 600; }
.chip .x { margin-left: 6px; opacity: .6; }

.big { font: 600 40px/1 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.big small { font: 500 15px var(--f-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper .iconbtn { width: 44px; height: 44px; font-size: 24px; background: var(--sunk); box-shadow: none; }
.cups { display: flex; flex-wrap: wrap; gap: 6px; }
.cup { width: 22px; height: 22px; border-radius: 50%; background: var(--sunk); }
.cup.on { background: var(--ink); }
.cup.extra { box-shadow: inset 0 0 0 1.5px var(--ink); background: none; }
.cup.extra.on { background: var(--ink); }
.meter { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.meter.over i { background: var(--bad); }

/* Grouped list rows (supplements) */
.supps { display: flex; flex-direction: column; }
.supp {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 48px;
  border: 0; border-bottom: .5px solid var(--hair); background: none; padding: 10px 0;
}
.supps .supp:last-child { border-bottom: 0; }
.supp .box {
  width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); flex: none;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--on-ink);
}
.supp.on .box { background: var(--ink); box-shadow: none; }
.supp.on .nm { color: var(--muted); }
.supp .nm { flex: 1; min-width: 0; }
.supp .tm { font-size: 13px; color: var(--muted); }

.meals { display: grid; grid-template-columns: 44px 1fr; gap: 8px 10px; align-items: center; }
.meals label { font-size: 14px; color: var(--muted); font-weight: 500; }

.split { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: .5px solid var(--hair); }
.split:first-of-type { border-top: 0; padding-top: 0; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; }
.addrow button {
  border: 0; box-shadow: inset 0 0 0 1px var(--line); background: none; border-radius: 980px;
  padding: 7px 13px; font-size: 13.5px; min-height: 34px;
}
.addrow button:active { background: var(--sunk); }
.addrow button small { color: var(--muted); font-size: 11.5px; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* History */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 9px var(--f-body); }
.chart .v { fill: var(--ink); font-size: 10px; font-weight: 600; }
.chart .grid { stroke: var(--hair); stroke-width: 1; }
.chart .goal { stroke: var(--muted); stroke-dasharray: 2 3; stroke-width: 1; }
.chart .bar { fill: var(--ink); opacity: .28; }
.chart .bar.last { opacity: 1; }
.chart .none { fill: var(--sunk); }
.moodcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.moodcal .wd { font-size: 11px; color: var(--muted); text-align: center; }
.moodcal .d {
  aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: var(--sunk);
  display: grid; place-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.moodcal .d[data-m] { color: var(--ink); }
.moodcal .d[data-m="1"] { background: color-mix(in srgb, var(--ink) 10%, var(--surface)); }
.moodcal .d[data-m="2"] { background: color-mix(in srgb, var(--ink) 24%, var(--surface)); }
.moodcal .d[data-m="3"] { background: color-mix(in srgb, var(--ink) 42%, var(--surface)); }
.moodcal .d[data-m="4"] { background: color-mix(in srgb, var(--ink) 68%, var(--surface)); color: var(--on-ink); }
.moodcal .d[data-m="5"] { background: var(--ink); color: var(--on-ink); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 5px; }

/* Cycle calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .wd { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 4px; }
.cal button {
  position: relative; aspect-ratio: 1; max-width: 100%; border: 0; background: none; border-radius: 50%;
  font-size: 15px; display: grid; place-items: center; padding: 0; font-variant-numeric: tabular-nums;
}
.cal button:disabled { cursor: default; }
.cal button.fut { color: var(--muted); }
.cal button.p1 { background: color-mix(in srgb, var(--ink) 30%, var(--surface)); }
.cal button.p2 { background: color-mix(in srgb, var(--ink) 62%, var(--surface)); color: var(--on-ink); }
.cal button.p3 { background: var(--ink); color: var(--on-ink); }
.cal button.pred { box-shadow: inset 0 0 0 1.5px var(--ink); background-image: none; border: 1.5px dashed var(--ink); box-shadow: none; }
.cal button.fert { background: var(--sunk); }
.cal button.ov { box-shadow: inset 0 0 0 1.5px var(--ink); }
.cal button.today { font-weight: 700; }
.cal button.today::after { content: ""; position: absolute; bottom: 12%; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.cal .blank { aspect-ratio: 1; }

/* Profile */
.people { display: flex; flex-wrap: wrap; gap: 8px; }
.list { display: flex; flex-direction: column; padding: 0; margin: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: center; padding: 12px 0; border-bottom: .5px solid var(--hair); min-height: 48px; }
.list li:last-child { border-bottom: 0; }
.list li .nm { flex: 1; min-width: 0; }
.list li small { color: var(--muted); font-size: 13px; }
.confirm { background: var(--sunk); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 340px) { .formgrid { grid-template-columns: 1fr; } }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.steps b { font-weight: 600; }

/* Welcome */
.welcome { max-width: 560px; margin: 0 auto; padding-top: 28px; display: flex; flex-direction: column; gap: 18px; }
.welcome > h2 { font: 700 40px/1.12 var(--f-display); margin: 0; letter-spacing: -0.035em; text-wrap: balance; }
.welcome .lead { font-size: 18px; line-height: 1.5; color: var(--muted); margin: 0; }
.welcome ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  background: var(--ink); color: var(--on-ink); padding: 11px 18px; border-radius: 980px; font-size: 14px;
  max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
}
/* Spending */
.money { font: 700 40px/1.05 var(--f-num); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; margin: 0; overflow-wrap: anywhere; }
.money small { font-size: 18px; font-weight: 600; margin-left: 2px; }
.amount { display: flex; align-items: baseline; gap: 6px; background: var(--sunk); border-radius: 14px; padding: 6px 14px; }
.amount input { flex: 1; min-width: 0; border: 0; background: none; font: 700 30px/1.3 var(--f-num); letter-spacing: -0.03em; padding: 4px 0; text-align: right; font-variant-numeric: tabular-nums; }
.amount input:focus { outline: none; }
.amount span { font-size: 18px; font-weight: 600; color: var(--muted); }
.amount:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.hbar .track { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.hbar .track i { display: block; height: 100%; border-radius: 99px; background: var(--ink); }
.hbar b { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.insights { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.insights li { font-size: 14.5px; line-height: 1.5; padding-left: 14px; position: relative; }
.insights li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.streak { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.streak b { color: var(--ink); }
.disclaimer { font-size: 12.5px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>건강수첩</h1>
      <span class="spacer"></span>
      <span id="sync" class="sync"></span>
      <label class="who" id="whoWrap" hidden><span class="av" id="whoAv" aria-hidden="true"></span><select id="who" aria-label="사용자 바꾸기"></select></label>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<nav class="tabbar" id="tabs" aria-label="메뉴" hidden></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- 작은 도구들 ---------- */
const $ = (s, r = document) => r.querySelector(s);

const pad = n => String(n).padStart(2, '0');

const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

/* ---------- 저장소: Claude 계정(가능하면) 또는 이 기기 브라우저 ---------- */
const Store = (() => {
  const PFX = 'healthbook:v1:';
  const mem = new Map();
  const timers = {}, busy = {};
  let db = null, uid = null, mode = 'local', status = 'ok';
  const statusFns = [];
  const lsGet = k => { try { const v = localStorage.getItem(PFX + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) { /* 저장 불가 */ } };
  const lsDel = k => { try { localStorage.removeItem(PFX + k); } catch (e) { /* 무시 */ } };
  const lsKeys = () => {
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PFX)) out.push(k.slice(PFX.length)); } } catch (e) { /* 무시 */ }
    return out;
  };
  const ref = k => db.doc('data/users/' + uid + '/' + k);
  const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
  const setStatus = s => { status = s; statusFns.forEach(f => f()); };

  async function get(k) {
    if (mem.has(k)) return mem.get(k);
    let v = null;
    if (db) {
      let fromDb = null;
      try { const s = await ref(k).get(); if (s.exists) fromDb = clone(s.data().v); } catch (e) { setStatus('error'); }
      if (mem.has(k)) return mem.get(k);
      if (fromDb != null) { v = fromDb; lsSet(k, v); }
      else { v = lsGet(k); if (v != null) { mem.set(k, v); queue(k); return v; } }
    } else v = lsGet(k);
    mem.set(k, v);
    return v;
  }
  const peek = k => mem.has(k) ? mem.get(k) : null;
  function queue(k) { clearTimeout(timers[k]); timers[k] = setTimeout(() => flush(k), 700); }
  async function flush(k) {
    if (busy[k]) { queue(k); return; }
    busy[k] = true; setStatus('saving');
    try { await ref(k).set({ v: mem.get(k), at: Date.now() }); setStatus('ok'); }
    catch (e) { setStatus(e && e.code === 'quota_exceeded' ? 'full' : 'error'); }
    busy[k] = false;
  }
  function set(k, v) { mem.set(k, v); lsSet(k, v); if (db) queue(k); }
  async function remove(k) {
    mem.delete(k); lsDel(k); clearTimeout(timers[k]);
    if (db) { try { await ref(k).delete(); } catch (e) { /* 무시 */ } }
  }
  async function keys() {
    const all = new Set(lsKeys());
    if (db) { try { const q = await db.collection('data/users/' + uid).get(); q.docs.forEach(d => all.add(d.id)); } catch (e) { /* 무시 */ } }
    mem.forEach((v, k) => all.add(k));
    return [...all];
  }
  async function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') return false;
    try {
      const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!d || !u) return false;
      const id = await u.id();
      if (!id) return false;
      db = d; uid = id; mode = 'account'; mem.clear(); setStatus('ok');
      return true;
    } catch (e) { return false; }
  }
  async function migrateLocal() { for (const k of lsKeys()) await get(k); }
  return {
    get, peek, set, remove, keys, connect, migrateLocal,
    onStatus: f => statusFns.push(f),
    get mode() { return mode; }, get status() { return status; },
  };
})();

const S = { meta: null, tab: 'today', date: today(), calMonth: today().slice(0, 7), confirm: null, backup: '', spendCat: '식비', spendWant: false };

const mk = (date, pid = P().id) => `d.${pid}.${date.slice(0, 7)}`;
const getDay = date => { const m = Store.peek(mk(date)); return (m && m[date]) || {}; };
function editDay(date, fn) {
  const k = mk(date);
  const m = Object.assign({}, Store.peek(k) || {});
  const r = JSON.parse(JSON.stringify(m[date] || {}));
  fn(r);
  m[date] = r;
  Store.set(k, m);
}
const saveMeta = () => Store.set('meta', S.meta);
async function ensureRange(from, to) {
  const ks = new Set([mk(to)]);
  for (let d = from; d <= to; d = addDays(d, 1)) ks.add(mk(d));
  await Promise.all([...ks].map(k => Store.get(k)));
}
function newProfile(name) {
  return {
    id: newId(), name, birthYear: null, height: null, weight: null,
    waterGoal: 8, sleepGoal: 7, caffeineLimit: 400, alcoholWeekLimit: null,
    trackCycle: true, cycleLength: 28, periodLength: 5, supplements: [], periods: {},
    monthBudget: null, habits: [],
  };
}
function normalize(m) {
  m = m && typeof m === 'object' ? m : {};
  m.v = 1;
  m.profiles = Array.isArray(m.profiles) ? m.profiles : [];
  m.profiles = m.profiles.map(p => Object.assign(newProfile(p.name || '나'), p));
  if (!m.profiles.find(p => p.id === m.activeId)) m.activeId = m.profiles[0] ? m.profiles[0].id : null;
  return m;
}
function setPath(obj, path, val) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === 'object') ? o[parts[i]] : {};
  const last = parts[parts.length - 1];
  if (val === '' || val == null || Number.isNaN(val)) delete o[last]; else o[last] = val;
}
const getPath = (obj, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);

function sleepMin(s) {
  if (!s || !s.bed || !s.wake) return null;
  const [bh, bm] = s.bed.split(':').map(Number), [wh, wm] = s.wake.split(':').map(Number);
  let m = (wh * 60 + wm) - (bh * 60 + bm);
  if (m <= 0) m += 1440;
  return m;
}
const hasAny = r => r && Object.keys(r).length > 0;
function streak(test, ref) {
  let d = ref, n = 0;
  if (!test(getDay(d))) d = addDays(d, -1);
  while (n < 400 && test(getDay(d))) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- 생리 주기 계산 ---------- */
function periodStarts(p) {
  const per = p.periods || {};
  const days = Object.keys(per).filter(k => per[k] > 0).sort();
  return days.filter(d => !(per[addDays(d, -1)] > 0) && !(per[addDays(d, -2)] > 0));
}
function cycleInfo(p, ref) {
  const starts = periodStarts(p).filter(d => d <= ref);
  const lens = [];
  for (let i = 1; i < starts.length; i++) { const L = diffDays(starts[i], starts[i - 1]); if (L >= 18 && L <= 60) lens.push(L); }
  const recent = lens.slice(-6);
  const avgLen = recent.length ? Math.round(avg(recent)) : (p.cycleLength || 28);
  if (!starts.length) return { starts, lens, avgLen, last: null };
  const last = starts[starts.length - 1];
  const day = diffDays(ref, last) + 1;
  const next = addDays(last, avgLen);
  const ov = addDays(next, -14);
  const fertFrom = addDays(ov, -5), fertTo = addDays(ov, 1);
  let phase;
  if (day <= (p.periodLength || 5)) phase = '월경기';
  else if (ref >= fertFrom && ref <= fertTo) phase = '배란기 (추정)';
  else if (ref < fertFrom) phase = '난포기';
  else phase = '황체기';
  let upOv = ov;
  while (addDays(upOv, 1) < ref) upOv = addDays(upOv, avgLen);
  return { starts, lens, avgLen, last, day, next, ov, fertFrom, fertTo, phase, dLeft: diffDays(next, ref), upOv, upFrom: addDays(upOv, -5), upTo: addDays(upOv, 1) };
}
function predictedSets(p, ci) {
  const period = new Set(), fert = new Set(), ov = new Set();
  if (!ci || !ci.last) return { period, fert, ov };
  const t = today();
  let start = ci.next;
  while (start < t) start = addDays(start, ci.avgLen);
  for (let c = 0; c < 3; c++) {
    const s = c === 0 ? start : addDays(start, ci.avgLen * c);
    for (let i = 0; i < (p.periodLength || 5); i++) period.add(addDays(s, i));
    const o = addDays(s, -14);
    ov.add(o);
    for (let i = -5; i <= 1; i++) fert.add(addDays(o, i));
  }
  if (ci.next > t) { const o = ci.ov; ov.add(o); for (let i = -5; i <= 1; i++) fert.add(addDays(o, i)); }
  return { period, fert, ov };
}

function chipsHtml(list, selected, opts) {
  const sel = selected || [];
  return `<div class="chips">${opts.map(o => {
    const on = sel.includes(o);
    return `<button type="button" class="chip ${on ? 'on' : ''}" data-act="chip" data-list="${list}" data-v="${esc(o)}" aria-pressed="${on}">${esc(o)}</button>`;

function rings(items) {
  const size = 128, sw = 13, gap = 3;
  const out = items.map((it, i) => {
    const r = size / 2 - sw / 2 - i * (sw + gap), C = 2 * Math.PI * r;
    const pct = Math.max(0, Math.min(1, it.pct || 0));
    return `<circle class="ring-track" cx="64" cy="64" r="${r}" fill="none" stroke-width="${sw}"></circle>
      <circle class="ring" cx="64" cy="64" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" opacity="${it.op}"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}" transform="rotate(-90 64 64)" ${pct === 0 ? 'stroke-opacity="0"' : ''}></circle>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="물, 수면, 영양제 목표 달성률">${out}</svg>`;
}
function pill(label, value, state) { return `<div class="pill ${state || ''}"><small>${label}</small><b>${value}</b></div>`; }

const labelOf = (list, k) => (list.find(x => x.k === k) || { label: k }).label;

/* ---------- 화면: 기록(그래프) ---------- */
function bars(vals, days, { goal, fmt, label, maxMin }) {
  const N = vals.length, step = 24, W = N * step, top = 14, ch = 78, H = top + ch + 16;
  const present = vals.filter(v => v != null);
  const max = Math.max(maxMin || 0, goal || 0, ...present, 1);
  let lastIdx = -1;
  vals.forEach((v, i) => { if (v != null) lastIdx = i; });
  const parts = [`<line class="grid" x1="0" x2="${W}" y1="${top + ch}" y2="${top + ch}"></line>`];
  vals.forEach((v, i) => {
    const x = i * step + 5, bw = step - 10;
    if (v == null || v === 0) parts.push(`<rect class="none" x="${x}" y="${top + ch - 3}" width="${bw}" height="3" rx="1.5"></rect>`);
    else {
      const h = Math.max(3, v / max * ch);
      parts.push(`<rect class="bar ${i === lastIdx ? 'last' : ''}" x="${x}" y="${top + ch - h}" width="${bw}" height="${h}" rx="3"></rect>`);
      if (i === lastIdx) parts.push(`<text class="v" x="${x + bw / 2}" y="${top + ch - h - 4}" text-anchor="middle">${fmt(v)}</text>`);
    }
    parts.push(`<text x="${x + bw / 2}" y="${H - 3}" text-anchor="middle">${parseD(days[i]).getDate()}</text>`);
  });
  if (goal) { const y = top + ch - goal / max * ch; parts.push(`<line class="goal" x1="0" x2="${W}" y1="${y}" y2="${y}"></line>`); }
  return `<svg class="chart" viewBox="0 -4 ${W} ${H + 4}" role="img" aria-label="${esc(label)}">${parts.join('')}</svg>`;
}
function viewHistory() {
  const p = P(), t = today(), N = 14;
  const days = []; for (let i = N - 1; i >= 0; i--) days.push(addDays(t, -i));
  const recs = days.map(getDay);
  const sleepH = recs.map(r => { const m = sleepMin(r.sleep); return m == null ? null : round1(m / 60); });
  const water = recs.map(r => hasAny(r) ? (r.water || 0) : null);
  const caf = recs.map(r => hasAny(r) ? sum(r.caffeine, x => x.mg) : null);
  const exMin = recs.map(r => getPath(r, 'exercise.min') ?? (hasAny(r) ? 0 : null));
  const supps = p.supplements || [];
  const suppRate = supps.length ? recs.filter(hasAny).map(r => supps.filter(s => r.supps && r.supps[s.id]).length / supps.length) : [];
  const logged = recs.filter(hasAny).length;
  const moodAvg = avg(recs.map(r => r.mood ?? null));
  const alc7 = round1(recs.slice(-7).reduce((a, r) => a + sum(r.alcohol, x => x.g), 0));
  const symptomCount = {};
  recs.forEach(r => (r.symptoms || []).forEach(s => { symptomCount[s] = (symptomCount[s] || 0) + 1; }));
  const topSym = Object.entries(symptomCount).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const weights = recs.map(r => r.weight ?? null).filter(v => v != null);

  // 4주 컨디션 달력 (일요일 시작)
  const calStart = addDays(t, -27 - parseD(addDays(t, -27)).getDay());
  const cells = [];
  for (let d = calStart; d <= t; d = addDays(d, 1)) {
    const r = getDay(d);
    cells.push(`<div class="d" ${r.mood ? `data-m="${r.mood}"` : ''} title="${fmtDate(d)}${r.mood ? ' · ' + SCALES.mood[r.mood - 1] : ''}">${parseD(d).getDate()}</div>`);
  }

  const tile = (label, value, note) => `<div class="pill"><small>${label}</small><b>${value}</b>${note ? `<small>${note}</small>` : ''}</div>`;
  const a = avg(sleepH), w = avg(water), c = avg(caf);
  return `
  ${titlebar(`${esc(p.name)} · ${fmtShort(days[0])} ~ ${fmtShort(t)} · ${logged}일 기록`, '최근 2주')}
  <div class="tiles">
    ${tile('평균 수면', a == null ? '-' : `${round1(a)}시간`, `목표 ${p.sleepGoal}시간`)}
    ${tile('평균 물', w == null ? '-' : `${round1(w)}잔`, `목표 ${p.waterGoal}잔`)}
    ${tile('영양제 복용률', suppRate.length ? `${Math.round(avg(suppRate) * 100)}%` : '-', supps.length ? '기록한 날 기준' : '영양제 미등록')}
    ${tile('평균 카페인', c == null ? '-' : `${Math.round(c)}mg`, `한도 ${p.caffeineLimit}mg`)}
    ${tile('평균 기분', moodAvg == null ? '-' : SCALES.mood[Math.round(moodAvg) - 1], moodAvg == null ? '' : `5점 중 ${round1(moodAvg)}`)}
    ${tile('최근 7일 알코올', `${alc7}g`, p.alcoholWeekLimit ? `목표 ${p.alcoholWeekLimit}g 이하` : '')}
    ${weights.length ? tile('최근 체중', `${weights[weights.length - 1]}kg`, weights.length > 1 ? `2주 전보다 ${round1(weights[weights.length - 1] - weights[0]) >= 0 ? '+' : ''}${round1(weights[weights.length - 1] - weights[0])}kg` : '') : ''}
  </div>
  <div class="cards">
    <section class="card" data-c="sleep"><header><h2>수면 시간</h2><span class="meta">점선 = 목표</span></header>
      ${bars(sleepH, days, { goal: p.sleepGoal, fmt: v => v + 'h', label: '최근 14일 수면 시간' })}</section>
    <section class="card" data-c="water"><header><h2>물</h2><span class="meta">잔 · 점선 = 목표</span></header>
      ${bars(water, days, { goal: p.waterGoal, fmt: v => v + '잔', label: '최근 14일 물 섭취' })}</section>
    <section class="card" data-c="caf"><header><h2>카페인</h2><span class="meta">mg · 점선 = 한도</span></header>
      ${bars(caf, days, { goal: p.caffeineLimit, fmt: v => v + '', label: '최근 14일 카페인' })}</section>
    <section class="card" data-c="move"><header><h2>운동 시간</h2><span class="meta">분</span></header>
      ${bars(exMin, days, { maxMin: 30, fmt: v => v + '분', label: '최근 14일 운동 시간' })}</section>
    <section class="card" data-c="cond"><header><h2>4주 기분 달력</h2></header>
      <div class="moodcal">${WD.map(x => `<div class="wd">${x}</div>`).join('')}${cells.join('')}</div>
      <div class="legend"><span><i style="background:var(--sunk)"></i>기록 없음</span><span><i style="background:color-mix(in srgb, var(--ink) 10%, var(--surface));box-shadow:inset 0 0 0 .5px var(--line)"></i>아주 나쁨</span><span><i style="background:var(--ink)"></i>아주 좋음</span></div>
    </section>
    <section class="card" data-c="cond"><header><h2>자주 나타난 몸 신호</h2></header>
      ${topSym.length ? `<ul class="list">${topSym.map(([s, n]) => `<li><span class="nm">${esc(s)}</span><small>${n}일</small></li>`).join('')}</ul><p class="hint">같은 신호가 반복되면 수면·카페인·생리 주기와 겹치는 날이 있는지 비교해 보세요.</p>` : '<p class="hint">2주 동안 기록된 몸 신호가 없어요.</p>'}
    </section>
  </div>`;
}

/* ---------- 화면: 소비 ---------- */
function viewSpend() {
  const p = P(), d = S.date, t = today(), r = getDay(d);
  const allDays = monthDays(d), upto = allDays.filter(x => x <= t);
  const recs = upto.map(getDay);
  const items = recs.flatMap(x => x.spend || []);
  const total = sum(items, s => s.amt);
  const dayItems = r.spend || [], dayTotal = sum(dayItems, s => s.amt);
  const byCat = {};
  items.forEach(s => { byCat[s.cat] = (byCat[s.cat] || 0) + s.amt; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;
  const want = sum(items.filter(s => s.want), s => s.amt);
  const noSpend = recs.filter(x => x.noSpend && !(x.spend || []).length).length;
  const isThisMonth = d.slice(0, 7) === t.slice(0, 7);
  const budget = p.monthBudget;
  const daysLeft = isThisMonth ? allDays.length - parseD(t).getDate() + 1 : 0;
  const remain = budget ? budget - total : null;
  const mLabel = `${parseD(d).getMonth() + 1}월`;

  const last7 = []; for (let i = 6; i >= 0; i--) last7.push(addDays(d, -i));
  const v7 = last7.map(x => { const y = getDay(x); return (y.spend || []).length ? sum(y.spend, s => s.amt) : (hasAny(y) ? 0 : null); });

  const insights = [];
  if (byCat['카페·간식'] || byCat['배달']) insights.push(`${mLabel} 카페·간식과 배달에 <b>${won((byCat['카페·간식'] || 0) + (byCat['배달'] || 0))}</b>을 썼어요. 하루 평균 ${won(((byCat['카페·간식'] || 0) + (byCat['배달'] || 0)) / Math.max(1, upto.length))}이에요.`);
  if (total) insights.push(`'사고 싶어서' 산 돈은 전체의 <b>${Math.round(want / total * 100)}%</b>(${won(want)})예요.${want / total > 0.3 ? ' 장바구니에 넣고 하루 기다려 보는 것만으로도 꽤 줄어요.' : ''}`);
  if (noSpend) insights.push(`이번 달 무지출 날은 <b>${noSpend}일</b>이에요.`);
  if (cats.length) insights.push(`가장 많이 쓴 곳은 <b>${esc(cats[0][0])}</b>(${won(cats[0][1])})예요.`);

  return `
  ${titlebar(`${d === t ? fmtDate(d) : fmtDate(d)} · ${esc(p.name)}`, '소비',
    `${d !== t ? '<button class="btn small" data-act="gotoday">오늘</button>' : ''}<button class="iconbtn" data-act="day" data-v="-1" aria-label="전날">‹</button><button class="iconbtn" data-act="day" data-v="1" aria-label="다음 날" ${d >= t ? 'disabled' : ''}>›</button>`)}
  <section class="card">
    <p class="eyebrow">${mLabel}에 쓴 돈</p>
    <p class="money">${Math.round(total).toLocaleString('ko-KR')}<small>원</small></p>
    ${budget ? `<div class="meter ${total > budget ? 'over' : ''}"><i style="width:${Math.min(100, total / budget * 100)}%"></i></div>
      <p class="hint">예산 ${won(budget)} 중 ${Math.round(total / budget * 100)}% 사용${isThisMonth ? (remain >= 0 ? ` · 남은 ${daysLeft}일 동안 <b style="color:var(--ink)">하루 ${won(remain / daysLeft)}</b>까지 쓸 수 있어요` : ` · 예산을 <b style="color:var(--bad)">${won(-remain)}</b> 넘었어요`) : ''}</p>`
    : `<div class="row"><label class="field"><span>한 달 생활비 예산을 정하면 하루에 얼마까지 써도 되는지 알려 드려요</span><input type="number" inputmode="numeric" id="pf-monthBudget" data-pf="monthBudget" placeholder="예: 800000" step="10000"></label></div>`}
  </section>

  <div class="cards">
    <section class="card">
      <header><h2>${d === t ? '오늘' : fmtShort(d)} 쓴 돈</h2><span class="meta">${won(dayTotal)}</span></header>
      <div class="amount"><input id="sp-amt" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="금액"><span>원</span></div>
      <div class="addrow">${[1000, 5000, 10000, 50000].map(v => `<button type="button" data-act="spendplus" data-v="${v}">+${v >= 10000 ? v / 10000 + '만' : v / 1000 + '천'}</button>`).join('')}</div>
      <div class="chips">${SPEND_CATS.map(c => `<button type="button" class="chip ${S.spendCat === c ? 'on' : ''}" data-act="spendcat" data-v="${c}" aria-pressed="${S.spendCat === c}">${c}</button>`).join('')}</div>
      <label class="field"><span>어디에 썼나요 (선택)</span><input id="sp-memo" maxlength="30" placeholder="예: 편의점 커피, 올리브영"></label>
      <div class="scale" role="group" aria-label="필요했는지">
        <button type="button" data-act="spendwant" data-v="0" class="${!S.spendWant ? 'on' : ''}" aria-pressed="${!S.spendWant}">꼭 필요했어요</button>
        <button type="button" data-act="spendwant" data-v="1" class="${S.spendWant ? 'on' : ''}" aria-pressed="${S.spendWant}">사고 싶어서 샀어요</button>
      </div>

/* ---------- 화면: 주기 ---------- */
function viewCycle() {
  const p = P(), t = today();
  if (!p.trackCycle) return `<section class="card" data-c="cycle"><header><h2>생리 주기</h2></header><p class="hint">${esc(p.name)}님은 생리 주기 기록이 꺼져 있어요.</p><div class="row"><button class="btn" data-tab="profile">사용자 탭에서 켜기</button></div></section>`;
  const ci = cycleInfo(p, t);
  const pred = predictedSets(p, ci);
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), dim = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push('<span class="blank"></span>');
  for (let i = 1; i <= dim; i++) {
    const d = `${S.calMonth}-${pad(i)}`;
    const lv = (p.periods || {})[d] || 0;
    const cls = [lv ? 'p' + lv : '', d > t ? 'fut' : '', d === t ? 'today' : '',
      !lv && d > t && pred.period.has(d) ? 'pred' : '', !lv && pred.fert.has(d) && d >= t ? 'fert' : '', pred.ov.has(d) && d >= t ? 'ov' : ''].join(' ');
    cells.push(`<button type="button" class="${cls}" data-act="caltoggle" data-date="${d}" ${d > t ? 'disabled' : ''} aria-label="${fmtDate(d)}${lv ? ' 생리 ' + FLOW[lv] : ''}">${i}</button>`);
  }
  const recent = ci.starts.slice(-6).map((s, i, arr) => {
    const idx = ci.starts.indexOf(s);
    const nextS = ci.starts[idx + 1];
    let len = 0; for (let k = 0; k < 10; k++) if ((p.periods || {})[addDays(s, k)] > 0) len = k + 1;
    return `<li><span class="nm">${fmtDate(s)} 시작</span><small>${len}일간${nextS ? ` · 주기 ${diffDays(nextS, s)}일` : ' · 진행 중인 주기'}</small></li>`;
  }).reverse();

  return `
  ${titlebar(esc(p.name), '생리 주기')}
  <div class="tiles">
    ${ci.last ? `
    <div class="pill"><small>지금</small><b>${ci.day}일째</b><small>${ci.phase}</small></div>
    <div class="pill ${ci.dLeft < 0 ? 'warn' : ''}"><small>다음 생리 예정</small><b>${ci.dLeft > 0 ? 'D-' + ci.dLeft : ci.dLeft === 0 ? '오늘' : `${-ci.dLeft}일 지남`}</b><small>${fmtDate(ci.next)}</small></div>
    <div class="pill"><small>평균 주기</small><b>${ci.avgLen}일</b><small>${ci.lens.length ? `최근 ${Math.min(6, ci.lens.length)}번 평균` : '기본값 (기록이 쌓이면 바뀌어요)'}</small></div>
    <div class="pill"><small>가임기 (추정)</small><b>${fmtShort(ci.upFrom)}~${fmtShort(ci.upTo)}</b><small>배란 예상 ${fmtShort(ci.upOv)}</small></div>`
    : `<div class="pill empty" style="grid-column:1/-1"><small>시작하기</small><b>아래 달력에서 최근 생리한 날을 눌러 주세요</b></div>`}
  </div>
  <div class="cards">
    <section class="card" data-c="cycle">
      <header><h2>${y}년 ${m}월</h2>
        <span class="meta row"><button class="iconbtn" data-act="cal" data-v="-1" aria-label="이전 달">‹</button><button class="iconbtn" data-act="cal" data-v="1" aria-label="다음 달">›</button></span></header>
      <div class="cal">${WD.map(x => `<span class="wd">${x}</span>`).join('')}${cells.join('')}</div>
      <div class="legend">
        <span><i style="background:var(--ink)"></i>생리한 날</span>
        <span><i style="border:1.5px dashed var(--ink)"></i>예정일</span>
        <span><i style="background:var(--sunk)"></i>가임기(추정)</span>
        <span><i style="box-shadow:inset 0 0 0 1.5px var(--ink)"></i>배란 예상일</span>
      </div>
      <p class="hint">지난 날짜를 누르면 생리한 날로 표시되고, 한 번 더 누르면 지워져요. 양은 오늘 탭에서 고를 수 있어요.</p>
    </section>
    <section class="card" data-c="cycle">
      <header><h2>최근 주기</h2></header>
      ${recent.length ? `<ul class="list">${recent.join('')}</ul>` : '<p class="hint">아직 기록이 없어요.</p>'}
      <p class="disclaimer">예정일·가임기는 지난 기록의 평균으로 계산한 추정치예요. 피임이나 임신 계획의 근거로 쓰지 말고, 주기가 21일보다 짧거나 35일보다 길게 반복되면 산부인과 상담을 받아 보세요.</p>
    </section>
  </div>`;
}

function renderHeader() {

function renderSync() {
  const el = $('#sync');
  const st = Store.status;
  if (Store.mode !== 'account') { el.className = 'sync'; el.textContent = '이 기기에 저장'; return; }
  el.className = 'sync ' + (st === 'ok' ? 'ok' : st === 'saving' ? 'saving' : 'error');
  el.textContent = st === 'ok' ? '계정에 저장됨' : st === 'saving' ? '저장 중…' : st === 'full' ? '저장 공간 가득 참' : '저장 실패, 다시 시도 중';
}
async function render() {
  const seq = ++renderSeq;
  const root = $('#app');
  if (!S.meta || !S.meta.profiles.length) { root.innerHTML = viewWelcome(); renderHeader(); return; }
  if (S.tab === 'cycle' && !P().trackCycle) S.tab = 'today';
  if (S.tab === 'today') await ensureRange(addDays(S.date, -62), S.date);
  if (S.tab === 'spend') await ensureRange(addDays(S.date.slice(0, 8) + '01', -7), S.date);
  if (S.tab === 'history') await ensureRange(addDays(today(), -34), today());
  if (seq !== renderSeq) return;
  const html = S.tab === 'spend' ? viewSpend() : S.tab === 'history' ? viewHistory() : S.tab === 'cycle' ? viewCycle() : S.tab === 'profile' ? viewProfile() : viewToday();
  root.innerHTML = html;
  renderHeader();
}
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}

  [-83, -55, -27].forEach((off, ci) => { for (let i = 0; i < 5; i++) p.periods[addDays(t, off + i)] = [2, 3, 2, 1, 1][i] - (ci === 1 && i === 1 ? 1 : 0); });
  p.monthBudget = 900000;
  p.habits = [{ id: newId(), name: '아침에 물 한 잔' }, { id: newId(), name: '10분 걷기' }, { id: newId(), name: '자기 전 폰 내려놓기' }];
  S.meta.profiles.push(p); S.meta.activeId = p.id;
  const shops = [['카페·간식', '아메리카노', 4500, false], ['식비', '편의점 점심', 7800, false], ['배달', '떡볶이', 21000, true], ['쇼핑', '올리브영', 32000, true], ['교통', '택시', 9800, false], ['생활용품', '다이소', 12000, false], ['카페·간식', '디저트', 6500, true], ['식비', '마트 장보기', 38000, false]];
  const meals = { breakfast: ['요거트, 바나나', '토스트, 커피', '', '삶은 달걀 2개'], lunch: ['급식 (현미밥, 미역국, 제육)', '급식 (카레, 샐러드)', '급식 (비빔밥, 된장국)'], dinner: ['닭가슴살 샐러드', '김치찌개, 밥', '떡볶이 (배달)', '연어 포케', '라면'], snack: ['', '과자', '아이스크림', '견과류'] };
  for (let i = 20; i >= 0; i--) {
    const d = addDays(t, -i);
    if (i > 0 && rnd() < 0.12) continue;
    editDay(d, r => {
      const tired = rnd();
      r.mood = 2 + Math.floor(rnd() * 4); r.energy = 1 + Math.floor(rnd() * 5); r.stress = 1 + Math.floor(rnd() * 4);
      if (tired < 0.35) r.symptoms = [pick(['피로', '두통', '소화불량', '피부 트러블'])];
      const bedM = 23 * 60 + Math.floor(rnd() * 120) - 30, sleepLen = 300 + Math.floor(rnd() * 150);
      const wakeM = (bedM + sleepLen) % 1440;
      r.sleep = { bed: `${pad(Math.floor(bedM / 60) % 24)}:${pad(bedM % 60 - bedM % 5)}`, wake: `${pad(Math.floor(wakeM / 60))}:${pad(wakeM % 60 - wakeM % 5)}` };
      r.sleepQ = 2 + Math.floor(rnd() * 4);
      r.water = i === 0 ? 3 : 3 + Math.floor(rnd() * 6);
      r.supps = {}; p.supplements.forEach(s => { if (rnd() < (i === 0 ? 0.5 : 0.75)) r.supps[s.id] = true; });
      r.meals = { breakfast: pick(meals.breakfast), lunch: pick(meals.lunch) };
      if (i > 0) { r.meals.dinner = pick(meals.dinner); r.meals.snack = pick(meals.snack); }
      r.foodTags = rnd() < 0.5 ? ['채소·과일'] : ['배달·외식'];
      r.caffeine = [{ k: 'americano', mg: 150 }]; if (rnd() < 0.4) r.caffeine.push({ k: pick(['latte', 'mix', 'tea']), mg: 50 + Math.floor(rnd() * 3) * 50 });
      r.caffeine = r.caffeine.map(x => ({ k: x.k, mg: (CAFFEINE.find(c => c.k === x.k) || x).mg }));
      if (rnd() < 0.18) r.alcohol = [{ k: 'beer', g: ALCOHOL[1].g }, { k: 'soju', g: ALCOHOL[0].g }];
      if (rnd() < 0.5) r.exercise = { type: pick(['걷기', '필라테스', '홈트']), min: 20 + Math.floor(rnd() * 5) * 10, steps: 4000 + Math.floor(rnd() * 7000) };
      if (i % 3 === 0) r.weight = round1(54 + (rnd() - 0.5) * 1.2);
      r.habits = {}; p.habits.forEach((h, hi) => { if (rnd() < [0.85, 0.6, 0.4][hi]) r.habits[h.id] = true; });
      if (rnd() < 0.15) r.noSpend = true;
      else { r.spend = []; const k = 1 + Math.floor(rnd() * 3); for (let j = 0; j < k; j++) { const s = pick(shops); r.spend.push({ cat: s[0], memo: s[1], amt: s[2], want: s[3] }); } }
      if (i === 0) r.note = '예시 기록이에요. 지우려면 사용자 탭에서 예시 사용자를 삭제하세요.';
    });
  }
  saveMeta();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-tab]');
  if (!b || b.disabled) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; S.confirm = null; await render(); window.scrollTo(0, 0); return; }
  const a = b.dataset.act, d = S.date, n = Number(b.dataset.v);
  const p = S.meta && S.meta.profiles.length ? P() : null;
  switch (a) {
    case 'day': { const nd = addDays(d, n); S.date = nd > today() ? today() : nd; break; }
    case 'gotoday': S.date = today(); break;
    case 'scale': editDay(d, r => { r[b.dataset.f] = r[b.dataset.f] === n ? undefined : n; }); break;
    case 'chip': editDay(d, r => { const arr = r[b.dataset.list] || []; const i = arr.indexOf(b.dataset.v); if (i >= 0) arr.splice(i, 1); else arr.push(b.dataset.v); r[b.dataset.list] = arr; }); break;
    case 'water': editDay(d, r => { r.water = Math.max(0, (r.water || 0) + n); }); break;
    case 'supp': editDay(d, r => { r.supps = r.supps || {}; if (r.supps[b.dataset.id]) delete r.supps[b.dataset.id]; else r.supps[b.dataset.id] = true; }); break;
    case 'suppall': editDay(d, r => { r.supps = {}; p.supplements.forEach(s => { r.supps[s.id] = true; }); }); break;
    case 'caf': { const c = CAFFEINE.find(x => x.k === b.dataset.k); editDay(d, r => { (r.caffeine = r.caffeine || []).push({ k: c.k, mg: c.mg }); }); break; }
    case 'cafdel': editDay(d, r => { (r.caffeine || []).splice(Number(b.dataset.i), 1); }); break;
    case 'alc': { const c = ALCOHOL.find(x => x.k === b.dataset.k); editDay(d, r => { (r.alcohol = r.alcohol || []).push({ k: c.k, g: c.g }); }); break; }
    case 'alcdel': editDay(d, r => { (r.alcohol || []).splice(Number(b.dataset.i), 1); }); break;
    case 'cig': editDay(d, r => { r.cigs = Math.max(0, (r.cigs || 0) + n); }); break;
    case 'period': { p.periods = p.periods || {}; if (n > 0) p.periods[d] = n; else delete p.periods[d]; saveMeta(); break; }
    case 'cal': { const [y, m] = S.calMonth.split('-').map(Number); const dt = new Date(y, m - 1 + n, 1); S.calMonth = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; break; }
    case 'caltoggle': { const dd = b.dataset.date; p.periods = p.periods || {}; if (p.periods[dd]) delete p.periods[dd]; else p.periods[dd] = 2; saveMeta(); break; }
    case 'switch': S.meta.activeId = b.dataset.id; S.confirm = null; saveMeta(); break;
    case 'addprof': { const np = newProfile(`사용자 ${S.meta.profiles.length + 1}`); S.meta.profiles.push(np); S.meta.activeId = np.id; saveMeta(); toast('새 사용자를 만들었어요. 이름을 바꿔 주세요.'); break; }
    case 'addsupp': {
      const name = $('#s-name').value.trim();
      if (!name) { toast('영양제 이름을 적어 주세요.'); $('#s-name').focus(); return; }
      p.supplements.push({ id: newId(), name, dose: $('#s-dose').value.trim(), time: $('#s-time').value });
      saveMeta(); toast(`${name}을(를) 추가했어요.`); break;
    }
    case 'habit': editDay(d, r => { r.habits = r.habits || {}; if (r.habits[b.dataset.id]) delete r.habits[b.dataset.id]; else r.habits[b.dataset.id] = true; }); break;
    case 'habitpreset': (p.habits = p.habits || []).push({ id: newId(), name: b.dataset.v }); saveMeta(); toast(`'${b.dataset.v}' 습관을 추가했어요.`); break;
    case 'addhabit': {
      const name = $('#h-name').value.trim();
      if (!name) { toast('습관 이름을 적어 주세요.'); $('#h-name').focus(); return; }
      (p.habits = p.habits || []).push({ id: newId(), name: name.slice(0, 24) }); saveMeta(); break;
    }
    case 'delhabit': p.habits = (p.habits || []).filter(h => h.id !== b.dataset.id); saveMeta(); break;
    case 'spendcat': S.spendCat = b.dataset.v; { const keep = [$('#sp-amt').value, $('#sp-memo').value]; await render(); $('#sp-amt').value = keep[0]; $('#sp-memo').value = keep[1]; } return;
    case 'spendwant': S.spendWant = n === 1; { const keep = [$('#sp-amt').value, $('#sp-memo').value]; await render(); $('#sp-amt').value = keep[0]; $('#sp-memo').value = keep[1]; } return;
    case 'spendplus': { const el = $('#sp-amt'); const cur = Number(el.value.replace(/[^0-9]/g, '')) || 0; el.value = (cur + n).toLocaleString('ko-KR'); return; }
    case 'addspend': {
      const amt = Number($('#sp-amt').value.replace(/[^0-9]/g, ''));
      if (!amt) { toast('금액을 적어 주세요.'); $('#sp-amt').focus(); return; }
      const memo = $('#sp-memo').value.trim().slice(0, 30);
      editDay(d, r => { (r.spend = r.spend || []).push({ amt, cat: S.spendCat, memo, want: S.spendWant }); delete r.noSpend; });
      toast(`${S.spendCat} ${won(amt)} 기록했어요.`); S.spendWant = false; break;
    }
    case 'spenddel': editDay(d, r => { (r.spend || []).splice(Number(b.dataset.i), 1); }); break;
    case 'nospend': editDay(d, r => { if (r.noSpend) delete r.noSpend; else r.noSpend = true; }); break;
    case 'delsupp': p.supplements = p.supplements.filter(s => s.id !== b.dataset.id); saveMeta(); break;
    case 'delprof': S.confirm = 'delprof'; break;
    case 'restore-ask': if (!$('#restoreIn').value.trim()) { toast('먼저 백업 내용을 붙여 넣어 주세요.'); return; } S.restoreText = $('#restoreIn').value; S.confirm = 'restore'; break;
    case 'cancel': S.confirm = null; break;
    case 'delprof-yes': {
      const id = p.id;
      S.meta.profiles = S.meta.profiles.filter(x => x.id !== id);
      S.meta.activeId = S.meta.profiles[0] ? S.meta.profiles[0].id : null;
      S.confirm = null; saveMeta();
      (await Store.keys()).filter(k => k.startsWith(`d.${id}.`)).forEach(k => Store.remove(k));
      toast('사용자를 삭제했어요.'); S.tab = S.meta.profiles.length ? 'profile' : 'today'; break;
    }
    case 'restore-yes': {
      try {
        const data = JSON.parse(S.restoreText || '');
        if (!data || data.app !== 'healthbook' || !data.data || !data.data.meta) throw new Error('형식');
        Object.entries(data.data).forEach(([k, v]) => { if (k === 'meta' || k.startsWith('d.')) Store.set(k, v); });
        S.meta = normalize(JSON.parse(JSON.stringify(data.data.meta))); saveMeta();
        S.confirm = null; S.restoreText = ''; toast('백업으로 되살렸어요.');
      } catch (err) { S.confirm = null; toast('백업 내용을 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 주세요.'); }
      break;
    }
    case 'backup': {
      const out = {};
      for (const k of await Store.keys()) { if (k === 'meta' || k.startsWith('d.')) { const v = await Store.get(k); if (v != null) out[k] = v; } }
      S.backup = JSON.stringify({ app: 'healthbook', v: 1, exportedAt: new Date().toISOString(), data: out });
      break;
    }
    case 'copy': {
      const ta = $('#backupOut');
      try { await navigator.clipboard.writeText(S.backup); toast('복사했어요. 메모장에 붙여 두세요.'); }
      catch (err) { ta.focus(); ta.select(); toast('글자가 선택됐어요. 길게 눌러 복사해 주세요.'); }
      return;
    }
    case 'download': {
      const url = URL.createObjectURL(new Blob([S.backup], { type: 'application/json' }));
      const link = document.createElement('a'); link.href = url; link.download = `건강수첩-백업-${today()}.json`; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000); return;
    }
    case 'start': {
      S.meta = normalize(S.meta);
      const np = newProfile(($('#w-name').value.trim() || '나').slice(0, 20));
      const yv = Number($('#w-year').value); if (yv > 1900) np.birthYear = yv;
      np.trackCycle = $('#w-cycle').checked;
      S.meta.profiles.push(np); S.meta.activeId = np.id; saveMeta();
      S.tab = 'today'; toast(`${np.name}님, 환영해요. 영양제는 사용자 탭에서 등록해요.`); break;
    }
    case 'demo': S.meta = normalize(S.meta); makeDemo(); S.tab = 'today'; S.date = today(); break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'sp-amt') { const n = el.value.replace(/[^0-9]/g, '').slice(0, 10); el.value = n ? Number(n).toLocaleString('ko-KR') : ''; return; }
  if (el.dataset.field && el.type !== 'time' && el.type !== 'number') editDay(S.date, r => setPath(r, el.dataset.field, el.value));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'sp-amt' || e.target.id === 'sp-memo')) { e.preventDefault(); $('[data-act=addspend]').click(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'who') { S.meta.activeId = el.value; S.confirm = null; saveMeta(); render(); return; }
  if (el.dataset.field && (el.type === 'time' || el.type === 'number')) {
    const val = el.type === 'number' ? (el.value === '' ? undefined : Number(el.value)) : el.value;
    editDay(S.date, r => setPath(r, el.dataset.field, val)); render(); return;
  }
  if (el.dataset.pf) {
    const p = P(), k = el.dataset.pf;
    if (el.type === 'checkbox') p[k] = el.checked;
    else if (el.type === 'number') p[k] = el.value === '' ? null : Number(el.value);
    else p[k] = el.value.trim().slice(0, 20) || p[k];
    saveMeta(); render();
  }
});

/* ---------- 시작 ---------- */
Store.onStatus(renderSync);
(async function boot() {
  S.meta = normalize(await Store.get('meta'));
  await render();
  if (await Store.connect()) {
    S.meta = normalize(await Store.get('meta'));
    await render();
    Store.migrateLocal();
  }
})();
</script>
</body>
</html>
