<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 단어 받아쓰기</title>
<style>
  :root { --main:#2563eb; --ok:#16a34a; --bad:#dc2626; --bg:#f1f5f9; --card:#fff; --text:#0f172a; --sub:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans KR",system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:26px; margin:0 0 16px; text-align:center; }
  .card { background:var(--card); border-radius:18px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:16px; }
  label { display:block; font-weight:700; margin:14px 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .chip { padding:14px 0; border:2px solid #cbd5e1; border-radius:12px; background:#fff; font-size:18px; font-weight:700; cursor:pointer; }
  .chip.on { border-color:var(--main); background:#dbeafe; color:var(--main); }
  select, input[type=text] { width:100%; font-size:20px; padding:12px; border:2px solid #cbd5e1; border-radius:12px; }
  input[type=text]:focus, select:focus { outline:none; border-color:var(--main); }
  .btn { display:block; width:100%; padding:16px; margin-top:18px; font-size:20px; font-weight:700; border:0; border-radius:14px; background:var(--main); color:#fff; cursor:pointer; }
  .btn.gray { background:#e2e8f0; color:var(--text); }
  .btn:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:10px; } .row .btn { margin-top:12px; }
  .unit { text-align:left; font-size:22px; }
  .who { text-align:center; color:var(--sub); margin-bottom:12px; }
  .progress { height:10px; background:#e2e8f0; border-radius:99px; overflow:hidden; margin-bottom:16px; }
  .progress div { height:100%; background:var(--main); transition:width .2s; }
  .qno { text-align:center; color:var(--sub); font-weight:700; }
  .speak { display:block; margin:16px auto; width:120px; height:120px; border-radius:50%; border:0; background:#fde68a; font-size:56px; cursor:pointer; }
  .speak:active { transform:scale(.95); }
  .meaning { text-align:center; font-size:22px; margin:8px 0 18px; min-height:30px; }
  .answer { text-align:center; font-size:28px !important; letter-spacing:1px; }
  .score { text-align:center; font-size:64px; font-weight:800; color:var(--main); margin:8px 0; }
  .list { list-style:none; padding:0; margin:0; }
  .list li { padding:12px 4px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; gap:8px; font-size:18px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .small { font-size:14px; color:var(--sub); text-align:center; }
  .hidden { display:none; }
  .msg { text-align:center; color:var(--bad); font-weight:700; min-height:24px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 영어 단어 받아쓰기</h1>

  <!-- 1. 내 정보 -->
  <section id="s-login" class="card hidden">
    <label>몇 반이에요?</label>
    <div class="grid" id="classGrid"></div>
    <label for="studentNo">번호</label>
    <select id="studentNo"></select>
    <label for="name">이름</label>
    <input type="text" id="name" placeholder="예: 김하늘" autocomplete="off">
    <div class="msg" id="loginMsg"></div>
    <button class="btn" id="loginBtn">다음 ▶</button>
  </section>

  <!-- 2. 단원 고르기 -->
  <section id="s-unit" class="hidden">
    <div class="who" id="who"></div>
    <div class="card">
      <label>오늘 볼 단원을 골라요</label>
      <div id="unitList"></div>
      <button class="btn gray" id="changeMe">내 정보 바꾸기</button>
    </div>
  </section>

  <!-- 3. 받아쓰기 -->
  <section id="s-test" class="card hidden">
    <div class="progress"><div id="bar"></div></div>
    <div class="qno" id="qno"></div>
    <button class="speak" id="speakBtn" title="다시 듣기">🔊</button>
    <div class="row" style="justify-content:center">
      <button class="btn gray" id="slowBtn" style="width:auto;padding:10px 18px;font-size:16px">🐢 천천히 듣기</button>
    </div>
    <div class="meaning" id="meaning"></div>
    <input type="text" id="answer" class="answer" placeholder="들은 단어를 영어로 써요"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <button class="btn gray" id="prevBtn">◀ 이전</button>
      <button class="btn" id="nextBtn">다음 ▶</button>
    </div>
  </section>

  <!-- 4. 제출 전 확인 -->
  <section id="s-review" class="card hidden">
    <label>내가 쓴 답을 확인해요</label>
    <p class="small">고치고 싶은 문제를 누르면 다시 풀 수 있어요.</p>
    <ul class="list" id="reviewList"></ul>
    <div class="msg" id="submitMsg"></div>
    <button class="btn" id="submitBtn">✅ 선생님께 제출하기</button>
  </section>

  <!-- 5. 결과 -->
  <section id="s-result" class="card hidden">
    <div class="small">내 점수</div>
    <div class="score" id="score"></div>
    <div class="small" id="scoreSub"></div>
    <ul class="list" id="resultList" style="margin-top:16px"></ul>
    <button class="btn" id="againBtn">다른 단원 하기</button>
  </section>

  <div id="loading" class="card small">불러오는 중...</div>
</div>

<script>
// 구글 시트 없이 이 파일만 열었을 때 미리보기용 가짜 서버
if (typeof google === 'undefined') {
  var DEMO = { 'Unit 1': [['apple','사과'],['banana','바나나'],['I like apples.','나는 사과를 좋아해.']] };
  window.google = { script: { run: (function () {
    function runner(ok, fail) {
      return {
        withSuccessHandler: function (f) { return runner(f, fail); },
        withFailureHandler: function (f) { return runner(ok, f); },
        getAppInfo: function () { setTimeout(function () { ok({ classCount: 8, units: Object.keys(DEMO), email: '' }); }, 100); },
        getWords: function (u) { setTimeout(function () { ok(DEMO[u].map(function (w, i) { return { id: i, meaning: w[1], speak: w[0] }; })); }, 100); },
        submitAnswers: function (p) { setTimeout(function () {
          var d = DEMO[p.unit].map(function (w, i) { var t = p.answers[i] || ''; return { word: w[0], meaning: w[1], typed: t, ok: t.trim().toLowerCase().replace(/[.!?]+$/,'') === w[0].toLowerCase().replace(/[.!?]+$/,'') }; });
          var c = d.filter(function (x) { return x.ok; }).length;
          ok({ score: Math.round(c / d.length * 100), correct: c, total: d.length, details: d });
        }, 300); }
      };
    }
    return runner(function () {}, function () {});
  })() } };
}

var $ = function (id) { return document.getElementById(id); };
var me = { classNo: null, studentNo: null, name: '' };
var state = { unit: null, words: [], idx: 0, answers: {} };

function show(id) {
  ['s-login','s-unit','s-test','s-review','s-result','loading'].forEach(function (s) { $(s).classList.add('hidden'); });
  $(id).classList.remove('hidden');
}
function fail(err) { show('s-unit'); alert('문제가 생겼어요. 선생님께 알려 주세요.\n' + (err && err.message || err)); }

// ----- 소리 -----
var voice = null;
function pickVoice() {
  var vs = speechSynthesis.getVoices().filter(function (v) { return /^en[-_]/i.test(v.lang); });
  voice = vs.find(function (v) { return /Google US English/i.test(v.name); })
       || vs.find(function (v) { return /en[-_]US/i.test(v.lang); }) || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate) {
  if (!('speechSynthesis' in window)) { alert('이 기기에서는 소리가 나오지 않아요.'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate || 0.85; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

// ----- 1. 내 정보 -----
function loadMe() { try { return JSON.parse(localStorage.getItem('dictation-me')) || null; } catch (e) { return null; } }
function saveMe() { try { localStorage.setItem('dictation-me', JSON.stringify(me)); } catch (e) {} }

function buildLogin(classCount) {
  var g = $('classGrid'); g.innerHTML = '';
  for (var c = 1; c <= classCount; c++) {
    var b = document.createElement('button');
    b.className = 'chip' + (me.classNo === c ? ' on' : ''); b.textContent = c + '반'; b.dataset.c = c;
    b.onclick = function () { me.classNo = Number(this.dataset.c); buildLogin(classCount); };
    g.appendChild(b);
  }
  var sel = $('studentNo');
  if (!sel.options.length) {
    sel.innerHTML = '<option value="">번호를 골라요</option>';
    for (var n = 1; n <= 35; n++) sel.innerHTML += '<option value="' + n + '">' + n + '번</option>';
  }
  if (me.studentNo) sel.value = me.studentNo;
  if (me.name) $('name').value = me.name;
}

$('loginBtn').onclick = function () {
  me.studentNo = Number($('studentNo').value) || null;
  me.name = $('name').value.trim();
  if (!me.classNo) return $('loginMsg').textContent = '반을 눌러 주세요.';
  if (!me.studentNo) return $('loginMsg').textContent = '번호를 골라 주세요.';
  if (!me.name) return $('loginMsg').textContent = '이름을 써 주세요.';
  $('loginMsg').textContent = '';
  saveMe(); showUnits();
};
$('changeMe').onclick = function () { show('s-login'); };

// ----- 2. 단원 -----
var info = null;
function showUnits() {
  $('who').textContent = me.classNo + '반 ' + me.studentNo + '번 ' + me.name;
  var list = $('unitList'); list.innerHTML = '';
  if (!info.units.length) list.innerHTML = '<p class="small">아직 열린 단원이 없어요. 선생님을 기다려요.</p>';
  info.units.forEach(function (u) {
    var b = document.createElement('button');
    b.className = 'btn gray unit'; b.textContent = '📘 ' + u;
    b.onclick = function () { startUnit(u); };
    list.appendChild(b);
  });
  show('s-unit');
}

// ----- 3. 받아쓰기 -----
function startUnit(u) {
  show('loading');
  google.script.run.withSuccessHandler(function (words) {
    if (!words.length) { alert('이 단원에는 아직 단어가 없어요.'); return showUnits(); }
    state = { unit: u, words: words, idx: 0, answers: {} };
    showQuestion();
  }).withFailureHandler(fail).getWords(u);
}

function showQuestion() {
  var w = state.words[state.idx], n = state.words.length;
  $('qno').textContent = state.unit + ' · ' + (state.idx + 1) + ' / ' + n;
  $('bar').style.width = (state.idx / n * 100) + '%';
  $('meaning').textContent = w.meaning ? '뜻: ' + w.meaning : '';
  $('answer').value = state.answers[w.id] || '';
  $('prevBtn').disabled = state.idx === 0;
  $('nextBtn').textContent = state.idx === n - 1 ? '다 썼어요 ✔' : '다음 ▶';
  show('s-test');
  $('answer').focus();
  setTimeout(function () { say(w.speak); }, 300);
}
function keep() { state.answers[state.words[state.idx].id] = $('answer').value.trim(); }

$('speakBtn').onclick = function () { say(state.words[state.idx].speak); $('answer').focus(); };
$('slowBtn').onclick = function () { say(state.words[state.idx].speak, 0.5); $('answer').focus(); };
$('prevBtn').onclick = function () { keep(); state.idx--; showQuestion(); };
$('nextBtn').onclick = function () {
  keep();
  if (state.idx < state.words.length - 1) { state.idx++; showQuestion(); } else showReview();
};
$('answer').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('nextBtn').click(); });
// 붙여넣기 막기 (다른 곳에서 복사해 오지 못하게)
$('answer').addEventListener('paste', function (e) { e.preventDefault(); });

// ----- 4. 확인 -----
function showReview() {
  var ul = $('reviewList'); ul.innerHTML = '';
  state.words.forEach(function (w, i) {
    var li = document.createElement('li'); li.style.cursor = 'pointer';
    var a = state.answers[w.id];
    li.innerHTML = '<span>' + (i + 1) + '. ' + esc(w.meaning || '🔊') + '</span><b class="' + (a ? '' : 'bad') + '">' + esc(a || '빈칸') + '</b>';
    li.onclick = function () { state.idx = i; showQuestion(); };
    ul.appendChild(li);
  });
  $('submitMsg').textContent = '';
  $('submitBtn').disabled = false;
  show('s-review');
}

$('submitBtn').onclick = function () {
  var blanks = state.words.filter(function (w) { return !state.answers[w.id]; }).length;
  if (blanks && !confirm('빈칸이 ' + blanks + '개 있어요. 그래도 제출할까요?')) return;
  $('submitBtn').disabled = true; $('submitMsg').textContent = '제출하는 중...';
  google.script.run.withSuccessHandler(showResult).withFailureHandler(function (e) {
    $('submitBtn').disabled = false;
    $('submitMsg').textContent = '제출이 안 됐어요. 인터넷을 확인하고 다시 눌러 주세요.';
  }).submitAnswers({ classNo: me.classNo, studentNo: me.studentNo, name: me.name, unit: state.unit, answers: state.answers });
};

// ----- 5. 결과 -----
function showResult(r) {
  $('score').textContent = r.score + '점';
  $('scoreSub').textContent = r.total + '개 중 ' + r.correct + '개 맞았어요' + (r.score === 100 ? ' 🎉' : '');
  var ul = $('resultList'); ul.innerHTML = '';
  (r.details || []).forEach(function (d) {
    var li = document.createElement('li');
    li.innerHTML = d.ok
      ? '<span class="ok">⭕ ' + esc(d.word) + '</span><span class="small">' + esc(d.meaning) + '</span>'
      : '<span class="bad">❌ ' + esc(d.typed || '빈칸') + '</span><span>정답: <b>' + esc(d.word) + '</b></span>';
    ul.appendChild(li);
  });
  show('s-result');
}
$('againBtn').onclick = function () { showUnits(); };

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

// ----- 시작 -----
google.script.run.withSuccessHandler(function (i) {
  info = i;
  me = loadMe() || me;
  buildLogin(i.classCount);
  if (me.classNo && me.studentNo && me.name) showUnits(); else show('s-login');
}).withFailureHandler(function (e) { $('loading').textContent = '불러오지 못했어요: ' + (e && e.message || e); }).getAppInfo();
</script>
</body>
</html>
